# ─── Nginx Configuration ──────────────────────────────────────────────────────
# Nginx is a reverse proxy - it sits in front of your services and routes
# traffic based on URL path. 
#
# Without Nginx: clients need to know port 8001 for secureship, 8002 for statusservice
# With Nginx: clients hit port 80 (or 443 for HTTPS), Nginx routes internally
#
# This is important because:
# 1. You never expose raw application ports to the internet in production
# 2. Nginx handles SSL termination (HTTPS), compression, and caching
# 3. It's the pattern the ALB replicates at the AWS level

# Number of worker processes. "auto" = one per CPU core.
worker_processes auto;

events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;
}

http {
    # ─── Upstream Definitions ─────────────────────────────────────────────────
    # "upstream" defines a group of backend servers.
    # Nginx load balances across servers in a group (round-robin by default).
    # In our case each upstream has one server (the container name).
    # Docker DNS resolves "secureship" to the container's IP automatically.

    upstream secureship_backend {
        # Format: server <host>:<port>
        # "secureship" resolves via Docker's internal DNS
        server secureship:8001;
        
        # keepalive: maintain persistent connections to the backend
        # Reduces connection overhead for high-traffic services
        keepalive 32;
    }

    upstream statusservice_backend {
        server statusservice:8002;
        keepalive 32;
    }

    upstream ragservice_backend {
        server ragservice:8003;
        keepalive 32;
    }

    # Grafana and Prometheus live on the observability host. "obs-server" is an
    # /etc/hosts entry supplied by docker-compose extra_hosts: the observability
    # server's private IP in production, the Docker host in local development.
    # Because it is a hosts entry it always resolves at startup, so these can be
    # ordinary upstream blocks. This replaced a placeholder that deploy.sh used to
    # sed into this file, which meant the copy on the server never matched git.
    upstream grafana_backend {
        server obs-server:3000;
    }

    upstream prometheus_backend {
        server obs-server:9090;
    }

    # ─── Real client IP ───────────────────────────────────────────────────────
    # Behind the ALB every request arrives from a load-balancer node, so without
    # this $remote_addr is the ALB's address and the limit_req zones below put all
    # clients in one shared bucket. Trust X-Forwarded-For only from private
    # ranges (the ALB and the local Docker bridge) and walk it from the right, so
    # a client cannot choose its own identity by sending a forged header.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ─── Rate Limiting ────────────────────────────────────────────────────────
    # Shared memory zone tracking request rates by client IP.
    # 10m = 10 megabytes of state (~160k IPs). Rate = sustained limit.
    # Burst handles sudden spikes without immediately returning 429.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=2r/s;
    limit_req_status 429;

    # ─── Logging Format ───────────────────────────────────────────────────────
    # JSON access logs so Promtail/Loki can parse them
    log_format json_combined escape=json
        '{'
            '"time":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # ─── Security ─────────────────────────────────────────────────────────────
    # Omit nginx version from Server header and error pages.
    # Default "Server: nginx/1.27.x" tells attackers which CVEs apply.
    server_tokens off;

    # No location below overrode nginx's silent 1MB default, so there was no
    # intentional ceiling protecting any backend from an oversized body — just
    # whatever nginx happened to default to. Set an explicit default here (small,
    # since most routes don't need large bodies) and raise it only on /ai/ below,
    # where RAGService's own 50KB-per-text limit means a real batch request can
    # legitimately approach several MB.
    client_max_body_size 1m;

    # Bound how long nginx waits for a slow client to finish sending headers/body
    # — an unbounded wait here is the classic Slowloris resource-exhaustion vector.
    client_header_timeout 10s;
    client_body_timeout 10s;

    # Compress JSON API responses and Grafana/Prometheus static assets.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    # ─── Server Block ─────────────────────────────────────────────────────────
    # A "server" block handles requests for a specific host/port combination
    server {
        # Listen on port 80 (HTTP) — both IPv4 and IPv6 so healthcheck works
        # in Alpine containers where localhost resolves to ::1 by default
        listen 80;
        listen [::]:80;

        # Accept requests for any hostname
        # In production, replace with your actual domain: secureship.click
        server_name _;

        # ─── Security Headers ─────────────────────────────────────────────────
        # Headers are set per-location rather than server-level because nginx's
        # add_header always flag with proxy_pass bypasses block-level inheritance,
        # causing the restrictive CSP to bleed onto Grafana/Prometheus responses
        # and break their JS. Each location that serves user content explicitly
        # declares the headers it needs.

        # ─── Health Check for Load Balancer ───────────────────────────────────
        # ALB will hit /nginx-health to check if Nginx itself is alive
        location /nginx-health {
            access_log off;    # Don't log health check spam
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ─── SecureShip Routes ────────────────────────────────────────────────
        # All requests starting with /api/ go to SecureShip
        location /api/ {
            # burst=20: allow up to 20 queued requests above the rate limit
            # nodelay: serve burst requests immediately (don't add artificial delay)
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://secureship_backend;

            # The upstream block's `keepalive 32` only actually reuses connections
            # when the proxying location also speaks HTTP/1.1 and clears the
            # Connection header — without these two lines nginx defaults to
            # HTTP/1.0 + Connection: close toward the backend, silently opening
            # (and closing) a fresh TCP connection on every single request.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Pass the real client IP to the backend
            # Without this, your app only sees Nginx's IP, not the real client
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;

            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }

        # SecureShip health check only. /metrics used to be proxied here as well,
        # which published unauthenticated application metrics to the internet for
        # no reason: Prometheus scrapes the service directly on its own port inside
        # the VPC and never comes through nginx.
        # Removing /metrics from the location below is not enough on its own: the
        # catch-all "location /" at the bottom proxies anything unmatched to
        # SecureShip, /metrics included. It has to be refused explicitly.
        location = /metrics {
            return 404;
        }

        location = /health {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://secureship_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }

        # ─── StatusService Routes ─────────────────────────────────────────────
        location /status/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://statusservice_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }

        location /load {
            # This is the cheapest DoS lever in the file if left unlimited: a
            # documented slow endpoint (150s read timeout) that used to have zero
            # rate limiting. Reuse ai_limit (2r/s) rather than api_limit — the
            # same "expensive per request" reasoning as the LLM endpoint below.
            limit_req zone=ai_limit burst=5 nodelay;

            proxy_pass http://statusservice_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            # Load endpoint takes longer - increase timeout
            proxy_read_timeout 150s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }

        location /fail {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://statusservice_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }

        # ─── RAGService (AI) ──────────────────────────────────────────────────
        # LLM calls can take 5-30 seconds so we raise the read timeout.
        # All AI endpoints live under /ai/ to keep routing predictable.
        # Stricter rate limit: each LLM call costs money and takes real time.
        # Ingestion writes to the knowledge base the LLM answers from. Left open,
        # anyone on the internet could add documents to it, which is both a
        # prompt-injection path and a way to poison every later answer. Only private
        # addresses may ingest; deploy.sh ingests the runbooks from the host itself.
        # (With the real-IP block above, $remote_addr here is the true client.)
        location = /ai/ingest {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            client_max_body_size 6m;
            proxy_pass http://ragservice_backend/ingest;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        location /ai/ {
            limit_req zone=ai_limit burst=5 nodelay;

            # RAGService's own /ingest validates 50KB per text, up to 100 texts —
            # a legitimate large batch can approach several MB, well past nginx's
            # 1MB default (and past what the http{} block now sets explicitly).
            client_max_body_size 6m;

            proxy_pass http://ragservice_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }

        # ─── Grafana ──────────────────────────────────────────────────────────
        # Redirect bare /grafana to /grafana/ so browsers without trailing slash work
        location = /grafana {
            return 301 /grafana/;
        }
        location /grafana/ {
            # Deliberately NOT the same CSP/Permissions-Policy set used on the API
            # routes above — that's exactly what caused the CSP-bleed bug this
            # config previously had (see the note under Security Headers). Only
            # add headers here that can't break Grafana's own inline scripts/panels.
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://grafana_backend;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # ─── Prometheus ───────────────────────────────────────────────────────
        location = /prometheus {
            return 301 /prometheus/;
        }
        # Prometheus runs with --web.enable-lifecycle (see docker-compose.yml) so
        # it can be config-reloaded without a restart — but that same flag exposes
        # unauthenticated /-/reload and /-/quit admin endpoints. Block them here
        # explicitly rather than trust that no one ever guesses the path; this
        # location is a longer/more specific literal prefix than /prometheus/
        # below, so nginx matches it first regardless of block order.
        location /prometheus/-/ {
            deny all;
            return 403;
        }

        location /prometheus/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://prometheus_backend;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # ─── Root ─────────────────────────────────────────────────────────────
        # Rate-limited same as /api/ — a DoS attacker hitting / would otherwise
        # bypass the /api/ limit and still saturate the secureship backend.
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://secureship_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        }
    }
}
