# ─── Docker Compose - Local Development ──────────────────────────────────────
# Docker Compose lets you run multiple containers together locally.
# In production we deploy to EC2 manually or via CI/CD.
# Locally we use this to test everything works before pushing.
#
# Usage:
#   docker-compose up -d          # Start everything in background
#   docker-compose logs -f        # Stream all logs
#   docker-compose down           # Stop and remove containers
#   docker-compose ps             # See what's running

services:

  # ─── SecureShip API ─────────────────────────────────────────────────────────
  secureship:
    build:
      context: ./apps/secureship
      dockerfile: Dockerfile
    # image: is used in production to pull from ECR instead of building locally.
    # Set ECR_REGISTRY + IMAGE_TAG in the environment:
    #   ECR_REGISTRY=123456.dkr.ecr.ap-south-1.amazonaws.com IMAGE_TAG=abc1234
    # Locally: ECR_REGISTRY is unset, so compose falls back to the build: above.
    image: ${ECR_REGISTRY:-observeops}/secureship:${IMAGE_TAG:-local}
    container_name: secureship
    ports:
      - "8001:8001"           # host_port:container_port
    environment:
      - APP_VERSION=1.0.0
      - ENVIRONMENT=local
      - DYNAMODB_TABLE=${DYNAMODB_TABLE:-}  # set in .env on EC2; empty = in-memory fallback locally
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    # healthcheck tells Docker when the container is truly ready
    # This is different from the Dockerfile HEALTHCHECK - this one
    # affects docker-compose depends_on conditions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Status Service ──────────────────────────────────────────────────────────
  statusservice:
    build:
      context: ./apps/statusservice
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-observeops}/statusservice:${IMAGE_TAG:-local}
    container_name: statusservice
    ports:
      - "8002:8002"
    environment:
      - FAILURE_RATE=0        # Set to 0.5 to simulate 50% failure rate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── RAGService (AI Pipeline) ────────────────────────────────────────────────
  # Answers natural-language questions about incidents and runbooks.
  # Uses LangGraph (agent graph) → FAISS (vector search) → Groq LLM (generation).
  # GROQ_API_KEY is read from the .env file in the project root.
  ragservice:
    build:
      context: ./apps/ragservice
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-observeops}/ragservice:${IMAGE_TAG:-local}
    container_name: ragservice
    ports:
      - "8003:8003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M    # increased from 512M — FAISS index + sentence-transformers + LangChain
        reservations:
          memory: 384M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  # Nginx sits in front of both services.
  # Without nginx: users hit port 8001 for secureship, 8002 for statusservice
  # With nginx: users hit port 80, nginx routes based on URL path
  # /api/* → secureship:8001
  # /status/* → statusservice:8002
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      # Mount our nginx config into the container
      # Changes to nginx.conf take effect after: docker-compose restart nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # condition: service_healthy (not just the plain list form) means nginx
    # actually waits for each backend's healthcheck to pass before it starts —
    # plain `depends_on: [x]` only waits for the container to be *created*,
    # which lets nginx start proxying before the app inside is ready to answer.
    depends_on:
      secureship:
        condition: service_healthy
      statusservice:
        condition: service_healthy
      ragservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Prometheus ──────────────────────────────────────────────────────────────
  # Prometheus scrapes /metrics from our services every 15 seconds
  # and stores the data in a time-series database on disk
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus_data:/prometheus    # Named volume persists data between restarts
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.external-url=https://secureship.click/prometheus/'
      - '--web.route-prefix=/prometheus/'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  # Grafana connects to Prometheus and renders dashboards
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=observeops123
      - GF_SERVER_ROOT_URL=https://secureship.click/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      # provisioning/ contains datasource + dashboard provider YAML configs
      # Grafana reads these on startup — no manual "Add datasource" clicks needed
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # dashboards/ contains the actual JSON files Grafana loads as dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - observeops
    restart: unless-stopped

  # ─── Loki ────────────────────────────────────────────────────────────────────
  # Loki stores logs. Promtail ships logs TO Loki. Grafana reads FROM Loki.
  # Think of it as: Promtail = log collector, Loki = log database, Grafana = log viewer
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Promtail ────────────────────────────────────────────────────────────────
  # Promtail watches Docker container logs and ships them to Loki
  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    volumes:
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      # Mount Docker socket so Promtail can read container logs
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    environment:
      # Overridden in .env on the app server (where loki container name won't resolve).
      # deploy.sh writes LOKI_HOST=<obs_private_ip> so logs ship cross-host.
      - LOKI_HOST=${LOKI_HOST:-loki}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observeops
    restart: unless-stopped

  # ─── AlertManager ────────────────────────────────────────────────────────────
  # AlertManager receives alerts FROM Prometheus and routes them to Slack/email
  # Prometheus detects the problem, AlertManager decides who gets notified
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Node Exporter ───────────────────────────────────────────────────────────
  # Exposes Linux system metrics (CPU, memory, disk, network) to Prometheus
  # Without this, Prometheus only knows about your app metrics, not the host
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro      # Linux process info
      - /sys:/host/sys:ro        # Linux hardware/kernel info
      - /:/rootfs:ro             # Root filesystem (for disk metrics)
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── LLM Alert Autopilot ─────────────────────────────────────────────────────
  # Receives AlertManager webhooks, queries Loki for log context,
  # calls Groq LLM for diagnosis, sends fix command to Slack.
  llm-alert-autopilot:
    image: ${ECR_REGISTRY:-llm-alert-autopilot}/llm-alert-autopilot:${IMAGE_TAG:-latest}
    build:
      context: ./apps/llm-alert-autopilot
      dockerfile: Dockerfile
    container_name: llm-alert-autopilot
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # On the app server Loki/Grafana run on the obs server (different host).
      # deploy.sh writes the real obs IP to .env; local dev falls back to container names.
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD:-observeops123}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observeops
    restart: unless-stopped

  # ─── Grafana Tempo (Distributed Tracing) ─────────────────────────────────────
  # Tempo stores traces. OpenTelemetry Collector ships traces TO Tempo.
  # Grafana reads FROM Tempo. Completes the metrics + logs + traces triad.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

  # ─── OpenTelemetry Collector ──────────────────────────────────────────────────
  # Receives traces from instrumented apps (secureship, ragservice) via OTLP
  # and forwards them to Tempo for storage.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4319:4317"   # OTLP gRPC (mapped to avoid conflict with tempo)
      - "4320:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

# ─── Named Volumes ────────────────────────────────────────────────────────────
# Volumes persist data even when containers are removed.
# Without volumes, all Prometheus metrics and Grafana dashboards would be lost
# every time you run docker-compose down.
volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
# Custom bridge network: containers can reach each other by service name
# e.g. prometheus can reach secureship at http://secureship:8001/metrics
# Without this custom network, containers can only communicate by IP address
networks:
  observeops:
    driver: bridge
