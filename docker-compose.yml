# ─── Docker Compose - Local Development ──────────────────────────────────────
# Docker Compose lets you run multiple containers together locally.
# In production we deploy to EC2 manually or via CI/CD.
# Locally we use this to test everything works before pushing.
#
# Usage:
#   docker-compose up -d          # Start everything in background
#   docker-compose logs -f        # Stream all logs
#   docker-compose down           # Stop and remove containers
#   docker-compose ps             # See what's running

services:

  # ─── SecureShip API ─────────────────────────────────────────────────────────
  secureship:
    build:
      context: ./apps/secureship
      dockerfile: Dockerfile
    # image: is used in production to pull from ECR instead of building locally.
    # Set ECR_REGISTRY + IMAGE_TAG in the environment:
    #   ECR_REGISTRY=123456.dkr.ecr.ap-south-1.amazonaws.com IMAGE_TAG=abc1234
    # Locally: ECR_REGISTRY is unset, so compose falls back to the build: above.
    image: ${ECR_REGISTRY:-observeops}/secureship:${IMAGE_TAG:-local}
    container_name: secureship
    ports:
      - "8001:8001"           # host_port:container_port
    environment:
      - APP_VERSION=1.0.0
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - DYNAMODB_TABLE=${DYNAMODB_TABLE:-}  # set in .env on EC2; empty = in-memory fallback locally
      # API key for /api/v1/*. Generated by Terraform, stored in SSM, written to .env by
      # user_data and refreshed by deploy.sh. Empty = open mode, which the service only
      # permits when no DynamoDB table is configured, i.e. local development.
      - API_KEY=${SECURESHIP_API_KEY:-}
      - REQUIRE_API_KEY=${REQUIRE_API_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    # healthcheck tells Docker when the container is truly ready
    # This is different from the Dockerfile HEALTHCHECK - this one
    # affects docker-compose depends_on conditions
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Status Service ──────────────────────────────────────────────────────────
  statusservice:
    build:
      context: ./apps/statusservice
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-observeops}/statusservice:${IMAGE_TAG:-local}
    container_name: statusservice
    ports:
      - "8002:8002"
    environment:
      - FAILURE_RATE=0        # Set to 0.5 to simulate 50% failure rate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── RAGService (AI Pipeline) ────────────────────────────────────────────────
  # Answers natural-language questions about incidents and runbooks.
  # Uses LangGraph (agent graph) → FAISS (vector search) → Groq LLM (generation).
  # GROQ_API_KEY is read from the .env file in the project root.
  ragservice:
    build:
      context: ./apps/ragservice
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-observeops}/ragservice:${IMAGE_TAG:-local}
    container_name: ragservice
    ports:
      - "8003:8003"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Which hosted model to call. Unset = the default in the code. This is
      # configuration because providers retire models: see apps/*/main.py.
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GROQ_REASONING_EFFORT=${GROQ_REASONING_EFFORT:-low}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      # The knowledge base. The service builds its index from these files every
      # time it starts, so it is complete again after any restart, and editing a
      # runbook needs only `docker compose restart ragservice`.
      - ./docs/runbooks:/app/runbooks:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M    # increased from 512M — FAISS index + sentence-transformers + LangChain
        reservations:
          memory: 384M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  # Nginx sits in front of both services.
  # Without nginx: users hit port 8001 for secureship, 8002 for statusservice
  # With nginx: users hit port 80, nginx routes based on URL path
  # /api/* → secureship:8001
  # /status/* → statusservice:8002
  nginx:
    image: nginx:1.30.5-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      # Mount our nginx config into the container
      # Changes to nginx.conf take effect after: docker-compose restart nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # "obs-server" is the observability host. In production OBS_SERVER_IP (from .env)
    # is its private IP; locally it falls back to the Docker host, where Grafana and
    # Prometheus publish their ports. The same nginx.conf works in both places and
    # nothing has to rewrite the file at deploy time.
    extra_hosts:
      - "obs-server:${OBS_SERVER_IP:-host-gateway}"
    # condition: service_healthy (not just the plain list form) means nginx
    # actually waits for each backend's healthcheck to pass before it starts —
    # plain `depends_on: [x]` only waits for the container to be *created*,
    # which lets nginx start proxying before the app inside is ready to answer.
    depends_on:
      secureship:
        condition: service_healthy
      statusservice:
        condition: service_healthy
      ragservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Prometheus ──────────────────────────────────────────────────────────────
  # Prometheus scrapes /metrics from our services every 15 seconds
  # and stores the data in a time-series database on disk
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - prometheus_data:/prometheus    # Named volume persists data between restarts
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 35d, not 15d: the availability SLO is evaluated over a 30-day window
      # (slo-rules.yml). A 30d rate() over 15 days of retained data silently reports
      # a 15-day budget while calling it a 30-day one.
      - '--storage.tsdb.retention.time=35d'
      - '--web.enable-lifecycle'
      - '--web.external-url=${PUBLIC_BASE_URL:-http://localhost:9090}/prometheus/'
      - '--web.route-prefix=/prometheus/'
    # "app-server" is the application host: its private IP in production
    # (APP_SERVER_IP in .env on the observability server), the Docker host locally.
    # prometheus.yml targets app-server:<port> and never needs rewriting.
    extra_hosts:
      - "app-server:${APP_SERVER_IP:-host-gateway}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────────────────────────────
  # Grafana connects to Prometheus and renders dashboards
  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Production: generated by Terraform, stored in SSM, written to .env on the
      # observability server at boot. The fallback is for a laptop only. It is
      # read once, when Grafana first creates its database; changing it later
      # means resetting the password in Grafana or removing the grafana_data volume.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-observeops123}
      - GF_SERVER_ROOT_URL=${PUBLIC_BASE_URL:-http://localhost:3000}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      # provisioning/ contains datasource + dashboard provider YAML configs
      # Grafana reads these on startup — no manual "Add datasource" clicks needed
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # dashboards/ contains the actual JSON files Grafana loads as dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M    # Grafana 13 idles near 160 MB; 256M left too little room for a dashboard load
        reservations:
          memory: 128M
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - observeops
    restart: unless-stopped

  # ─── Loki ────────────────────────────────────────────────────────────────────
  # Loki stores logs. Alloy ships logs TO Loki. Grafana reads FROM Loki.
  # Alloy = log collector, Loki = log database, Grafana = log viewer.
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    # No container health check. This image is distroless: it has no shell and no
    # wget or curl, so a check that execs one of them cannot run at all and Docker
    # reports the container unhealthy forever. That is not harmless, because
    # anything that waits on `condition: service_healthy` then never starts.
    # Health is watched from outside instead: Prometheus scrapes this service and
    # the alert rules fire on up == 0.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Grafana Alloy (log shipper) ─────────────────────────────────────────────
  # Reads the output of every container on this host and pushes it to Loki.
  # Runs on BOTH servers, because each has containers whose logs matter.
  #
  # This was Promtail until October 2026. Promtail reached end of life in March
  # 2026 and receives no further fixes; Alloy is its replacement. The pipeline in
  # monitoring/alloy/config.alloy was produced with `alloy convert` and applies
  # the same labels, so no dashboard or query changed.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    command:
      - run
      # 9080, not Alloy's default 12345. On the Windows machine this was developed
      # on, 12345 could be reached from the host but not through the Docker host
      # gateway, while every other published port could (12345 is an old trojan's
      # port and some security software drops it). A port that works everywhere
      # beats a default that works almost everywhere.
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "9080:9080"   # its own metrics and the component graph UI (/graph)
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # The Docker socket is how it discovers containers and reads their logs.
      # Be clear about what this is: access to the socket is control of the Docker
      # daemon, which is root on the host. ":ro" protects the socket FILE, not the
      # API behind it. It is the standard way to collect container logs and it is
      # also the most privileged thing in this file.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      # Read positions survive a restart, so logs are neither re-sent nor skipped.
      - alloy_data:/var/lib/alloy/data
    # Same name-for-a-role idea as nginx and the collector: Loki lives on the
    # observability host, whatever its address is here.
    extra_hosts:
      - "obs-server:${OBS_SERVER_IP:-host-gateway}"
    # The image has bash but neither wget nor curl, so the check opens the socket
    # itself and asks Alloy's readiness endpoint.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q 'ready' <&3"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - observeops
    restart: unless-stopped

  # ─── AlertManager ────────────────────────────────────────────────────────────
  # AlertManager receives alerts FROM Prometheus and routes them to Slack/email
  # Prometheus detects the problem, AlertManager decides who gets notified
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Webhook URLs are secrets, so AlertManager reads them from files at notify time
      # (api_url_file / url_file) instead of having them sed-ed into the tracked config.
      # user_data writes them from SSM in production. See secrets/README.md.
      - ./monitoring/alertmanager/secrets:/etc/alertmanager/secrets:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    extra_hosts:
      - "app-server:${APP_SERVER_IP:-host-gateway}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── Node Exporter ───────────────────────────────────────────────────────────
  # Exposes Linux system metrics (CPU, memory, disk, network) to Prometheus
  # Without this, Prometheus only knows about your app metrics, not the host
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro      # Linux process info
      - /sys:/host/sys:ro        # Linux hardware/kernel info
      - /:/rootfs:ro             # Root filesystem (for disk metrics)
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    networks:
      - observeops
    restart: unless-stopped

  # ─── LLM Alert Autopilot ─────────────────────────────────────────────────────
  # Receives AlertManager webhooks, queries Loki for log context,
  # calls Groq LLM for diagnosis, sends fix command to Slack.
  llm-alert-autopilot:
    image: ${ECR_REGISTRY:-observeops}/llm-alert-autopilot:${IMAGE_TAG:-local}
    build:
      context: ./apps/llm-alert-autopilot
      dockerfile: Dockerfile
    container_name: llm-alert-autopilot
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Which hosted model to call. Unset = the default in the code. This is
      # configuration because providers retire models: see apps/*/main.py.
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GROQ_REASONING_EFFORT=${GROQ_REASONING_EFFORT:-low}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # On the app server Loki/Grafana run on the obs server (different host).
      # deploy.sh writes the real obs IP to .env; local dev falls back to container names.
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # It had no limit at all, so a leak here could have taken the whole host with
    # it. It idles around 50 MB.
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          memory: 64M
    depends_on:
      loki:
        condition: service_started
    networks:
      - observeops
    restart: unless-stopped

  # ─── Grafana Tempo (Distributed Tracing) ─────────────────────────────────────
  # Tempo stores traces. OpenTelemetry Collector ships traces TO Tempo.
  # Grafana reads FROM Tempo. Completes the metrics + logs + traces triad.
  tempo:
    # Newest release of the 2.x line, deliberately not 3.x. Tempo 3 replaced the
    # ingester and compactor with a different component model, so its config has
    # no `ingester:` or `compactor:` section and this stack's tempo.yaml does not
    # load there. Moving is a migration to plan and test, not a version bump.
    image: grafana/tempo:2.10.8
    container_name: tempo
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    # No container health check. This image is distroless: it has no shell and no
    # wget or curl, so a check that execs one of them cannot run at all and Docker
    # reports the container unhealthy forever. That is not harmless, because
    # anything that waits on `condition: service_healthy` then never starts.
    # Health is watched from outside instead: Prometheus scrapes this service and
    # the alert rules fire on up == 0.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

  # ─── OpenTelemetry Collector ──────────────────────────────────────────────────
  # Receives traces from instrumented apps (secureship, ragservice) via OTLP
  # and forwards them to Tempo for storage.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector.yaml:/etc/otel-collector.yaml:ro
    extra_hosts:
      - "obs-server:${OBS_SERVER_IP:-host-gateway}"
    ports:
      - "4319:4317"   # OTLP gRPC (mapped to avoid conflict with tempo)
      - "4320:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - observeops
    restart: unless-stopped

# ─── Named Volumes ────────────────────────────────────────────────────────────
# Volumes persist data even when containers are removed.
# Without volumes, all Prometheus metrics and Grafana dashboards would be lost
# every time you run docker-compose down.
volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  alloy_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
# Custom bridge network: containers can reach each other by service name
# e.g. prometheus can reach secureship at http://secureship:8001/metrics
# Without this custom network, containers can only communicate by IP address
networks:
  observeops:
    driver: bridge
