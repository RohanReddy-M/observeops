# Unit tests for the alerting and recording rules.
#
#   docker run --rm -v "$PWD/monitoring/prometheus:/rules" --entrypoint promtool \
#     prom/prometheus:v3.15.0 test rules /rules/tests/alerts_test.yml
#   (or: make test-alerts)
#
# Why these exist. A review in October 2026 found that three error-rate alerts
# divided each series by itself and so reported 100% whenever a single 5xx
# appeared, and that one alert queried a metric that does not exist in this
# deployment and could never fire. None of that broke anything visible: a wrong
# alert rule is silent until the day it is needed. These tests feed synthetic
# series into the real rule files and assert exactly which alerts fire, and when.

rule_files:
  - ../alerts.yml
  - ../slo-rules.yml

evaluation_interval: 15s

tests:

  # ── ServiceDown: the detection-time contract ────────────────────────────────
  # scrape_interval and evaluation_interval are both 15s and the rule has
  # `for: 1m`. From the first evaluation that sees up == 0, the alert is PENDING
  # for a full minute and only then FIRING. Measured from the moment a service
  # actually dies that is 60s plus up to one scrape interval plus up to one
  # evaluation interval: between 60 and 90 seconds, never less. AlertManager's
  # group_wait (30s) then delays the notification, not the alert.
  - name: ServiceDown is pending for one minute and only then fires
    interval: 15s
    input_series:
      # up for the first minute (t=0..45s), then down from t=60s onward
      - series: 'up{job="ragservice", instance="app-server:8003", service="ragservice", team="ai"}'
        values: '1+0x3 0+0x20'
    alert_rule_test:
      - eval_time: 1m          # first evaluation that sees it down: pending
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 1m45s       # down for 45s: still pending, still not firing
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 2m          # down for a full 60s: firing
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ragservice
              instance: app-server:8003
              service: ragservice
              team: ai
            exp_annotations:
              summary: "Service ragservice is down"
              description: "ragservice on app-server:8003 has been unreachable for more than 1 minute. Check if the container is running: docker ps | grep ragservice"
              runbook_url: "https://github.com/RohanReddy-M/observeops/blob/main/docs/runbooks/service-down.md"

  # ── Error rate: 2% must not page ────────────────────────────────────────────
  # The regression test for the self-division bug. 98 successes and 2 errors per
  # interval is a 2% error rate, below the 5% threshold. The old expression
  # evaluated to 100% here and fired both alerts.
  - name: a 2 percent error rate fires nothing
    interval: 15s
    input_series:
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="200"}'
        values: '0+98x60'
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="500"}'
        values: '0+2x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: CriticalErrorRate
        exp_alerts: []

  - name: a 10 percent error rate is a warning, not critical
    interval: 15s
    input_series:
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="200"}'
        values: '0+90x60'
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="500"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              job: secureship
            exp_annotations:
              summary: "High error rate on secureship"
              description: "Error rate is 10% for secureship. Normal is < 1%. Check logs in Grafana Loki dashboard."
      - eval_time: 10m
        alertname: CriticalErrorRate
        exp_alerts: []

  - name: a 50 percent error rate is critical
    interval: 15s
    input_series:
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="200"}'
        values: '0+50x60'
      - series: 'http_requests_total{job="secureship", method="POST", endpoint="/api/v1/ships", status_code="503"}'
        values: '0+50x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: CriticalErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              job: secureship
            exp_annotations:
              summary: "CRITICAL error rate on secureship"
              description: "Error rate is 50% - service is degraded significantly."

  - name: StatusService error rate is measured against all its requests
    interval: 15s
    input_series:
      - series: 'status_requests_total{job="statusservice", endpoint="/fail", status="200"}'
        values: '0+97x60'
      - series: 'status_requests_total{job="statusservice", endpoint="/fail", status="500"}'
        values: '0+3x60'
    alert_rule_test:
      - eval_time: 10m         # 3% is under the 5% threshold
        alertname: StatusServiceHighErrorRate
        exp_alerts: []

  # ── Restart loop ────────────────────────────────────────────────────────────
  - name: three restarts in fifteen minutes fires, a stable process does not
    interval: 15s
    input_series:
      # start time changes three times: three restarts
      - series: 'process_start_time_seconds{job="ragservice", instance="app-server:8003"}'
        values: '1000+0x3 2000+0x3 3000+0x3 4000+0x20'
      # never changes: never restarted
      - series: 'process_start_time_seconds{job="secureship", instance="app-server:8001"}'
        values: '1000+0x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: ContainerRestartingFrequently
        exp_alerts:
          - exp_labels:
              severity: critical
              job: ragservice
              instance: app-server:8003
            exp_annotations:
              summary: "ragservice restarted 3 times in 15 minutes"
              description: "ragservice is restart-looping. Read the logs of the container that died, not the one running now: docker logs --tail 100 ragservice, and check 'docker inspect ragservice' for OOMKilled and the exit code."

  # ── Zombie recovery: up, healthy, and useless ───────────────────────────────
  # The state the 2026-05-31 chaos experiment discovered: the service restarted,
  # its health check passed, and its in-memory index was empty.
  - name: RAGIndexEmpty fires when the service is up with zero documents
    interval: 15s
    input_series:
      - series: 'up{job="ragservice", instance="app-server:8003"}'
        values: '1+0x20'
      - series: 'vector_store_documents_total{job="ragservice", instance="app-server:8003"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 1m45s       # under the 2m `for:`
        alertname: RAGIndexEmpty
        exp_alerts: []
      - eval_time: 2m
        alertname: RAGIndexEmpty
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ragservice
              instance: app-server:8003
            exp_annotations:
              summary: "RAGService is up but knowledge base is empty (0 documents)"
              description: "RAGService is running but the FAISS index has no documents. All queries will return 'I don't have enough context'. Fix: sudo docker compose -f /opt/observeops/docker-compose.yml restart ragservice (auto-ingest will repopulate)"

  - name: RAGIndexEmpty stays quiet when documents are loaded
    interval: 15s
    input_series:
      - series: 'up{job="ragservice", instance="app-server:8003"}'
        values: '1+0x20'
      - series: 'vector_store_documents_total{job="ragservice", instance="app-server:8003"}'
        values: '42+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: RAGIndexEmpty
        exp_alerts: []

  # ── The AI layer failing quietly ────────────────────────────────────────────
  - name: any failed LLM diagnosis raises a warning
    interval: 15s
    input_series:
      - series: 'autopilot_diagnosis_errors_total{job="llm-alert-autopilot", stage="NotFoundError"}'
        values: '0+0x8 1+0x8 2+0x20'
    alert_rule_test:
      - eval_time: 1m          # no errors yet
        alertname: AutopilotDiagnosisFailing
        exp_alerts: []
      - eval_time: 5m          # two diagnoses have failed
        alertname: AutopilotDiagnosisFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: llm-alert-autopilot
            exp_annotations:
              summary: "LLM alert diagnosis is failing (2 errors in 15m)"
              description: "llm-alert-autopilot received alerts but could not diagnose them. Alerts are still delivered, without a diagnosis. Check: docker logs --tail 50 llm-alert-autopilot. Common causes: the GROQ_MODEL no longer exists at the provider, the API key was revoked, or Loki is unreachable."

  - name: a 4 percent LLM error rate is under the threshold, 50 percent is not
    interval: 15s
    input_series:
      - series: 'llm_requests_total{job="ragservice", model="m", status="success"}'
        values: '0+96x40 3840+50x40'
      - series: 'llm_requests_total{job="ragservice", model="m", status="error"}'
        values: '0+4x40 160+50x40'
    alert_rule_test:
      - eval_time: 9m          # 4 errors per 100 calls
        alertname: LLMHighErrorRate
        exp_alerts: []
      - eval_time: 19m         # half of all calls failing
        alertname: LLMHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              job: ragservice
            exp_annotations:
              summary: "High LLM error rate on RAGService"
              description: "LLM error rate is 50%. Check Groq API key and quota at console.groq.com"

  # ── Deadman switch ──────────────────────────────────────────────────────────
  - name: Watchdog is always firing
    interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "Watchdog — confirms Prometheus and AlertManager pipeline is alive"
              description: "This alert always fires. If it stops appearing in AlertManager, the alerting pipeline is broken. Route this to healthchecks.io in production."

  # ── SLO burn rate ───────────────────────────────────────────────────────────
  # SLO 99.5% leaves a 0.5% error budget. Burn rate = observed error ratio / 0.005.
  # 14.4 over one hour consumes 2% of a 30-day budget in that hour (0.02 * 720h);
  # 6 over six hours consumes 5% (0.05 * 720h / 6h).
  - name: a sustained 20 percent error ratio burns the budget 40 times too fast
    interval: 15s
    input_series:
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="200"}'
        values: '0+80x1500'
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="500"}'
        values: '0+20x1500'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: SecureShipBurnRateTooHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: "true"
            exp_annotations:
              summary: "SecureShip burn rate critical (1h: 40x)"
              description: "Error budget burning fast on both 1h and 6h windows. Monthly budget will be exhausted in hours. Check error rate and recent deploys immediately."

  - name: an error ratio at exactly the SLO burns the budget at rate 1 and does not page
    interval: 15s
    input_series:
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="200"}'
        values: '0+199x1500'
      - series: 'http_requests_total{job="secureship", method="GET", endpoint="/api/v1/ships", status_code="500"}'
        values: '0+1x1500'
    alert_rule_test:
      - eval_time: 6h10m
        alertname: SecureShipBurnRateTooHigh
        exp_alerts: []
