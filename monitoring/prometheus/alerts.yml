# ─── Prometheus Alert Rules ───────────────────────────────────────────────────
# Alert rules define CONDITIONS that, when true for a certain duration,
# trigger an alert that gets sent to AlertManager.
#
# Structure of each alert:
#   alert: name of the alert (shown in Slack/Grafana)
#   expr:  PromQL expression - when this is TRUE, alert is "pending"
#   for:   how long expr must be true before alert "fires" (avoids flapping)
#   labels: metadata attached to the alert (severity, team, etc.)
#   annotations: human-readable description shown in notification

groups:

  # ─── Service Availability Alerts ──────────────────────────────────────────
  - name: service_availability
    rules:

      - alert: ServiceDown
        # up == 0 means Prometheus couldn't scrape the target
        # This means the service is completely unreachable
        expr: up == 0
        for: 1m    # Must be down for 1 full minute (avoids brief restart flaps)
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 1 minute. Check if the container is running: docker ps | grep {{ $labels.job }}"
          runbook_url: "https://github.com/RohanReddy-M/observeops/blob/main/docs/runbooks/service-down.md"

      - alert: ContainerRestartingFrequently
        # kube_pod_container_status_restarts_total comes from kube-state-metrics (K8s)
        # increase() over 15m counts restarts in that window
        # Catches CrashLoopBackOff before Kubernetes gives up
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} container {{ $labels.container }} restarting"
          description: "Container restarted {{ $value }} times in 15 minutes. Check logs: kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }} --previous"

  # ─── Error Rate Alerts ─────────────────────────────────────────────────────
  - name: error_rates
    rules:

      - alert: HighErrorRate
        # This PromQL expression:
        # 1. Gets the rate of 5xx requests per second over 5 minutes
        # 2. Divides by total request rate to get a percentage
        # 3. Fires if error rate > 5%
        expr: |
          (
            rate(http_requests_total{status_code=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanize }}% for {{ $labels.job }}. Normal is < 1%. Check logs in Grafana Loki dashboard."

      - alert: CriticalErrorRate
        expr: |
          (
            rate(http_requests_total{status_code=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) * 100 > 25
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanize }}% - service is degraded significantly."

      - alert: StatusServiceHighErrorRate
        # StatusService emits status_requests_total with label 'status' (not status_code).
        # Separate alert covers the /fail endpoint simulated errors.
        expr: |
          (
            rate(status_requests_total{status="500"}[5m])
            /
            rate(status_requests_total[5m])
          ) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "StatusService high error rate ({{ $value | humanize }}%)"
          description: "StatusService /fail endpoint is returning errors above threshold. Check FAILURE_RATE env var."

  # ─── Latency Alerts ────────────────────────────────────────────────────────
  - name: latency
    rules:

      - alert: HighLatency
        # histogram_quantile calculates the 99th percentile latency
        # p99 > 2 seconds means 1% of requests take more than 2 seconds
        # This catches slow queries, memory pressure, etc.
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency on {{ $labels.job }}"
          description: "99th percentile latency is {{ $value | humanizeDuration }} for {{ $labels.job }}. Check if the instance is CPU or memory constrained."

  # ─── Infrastructure Alerts ─────────────────────────────────────────────────
  - name: infrastructure
    rules:

      - alert: HighCPUUsage
        # node_cpu_seconds_total tracks CPU time by mode (idle, user, system, etc.)
        # This expression calculates the percentage of time NOT spent idle
        expr: |
          (
            1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
            by (instance)
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}%. Run 'top' on the instance to identify the consuming process."

      - alert: HighMemoryUsage
        # node_memory_MemAvailable_bytes = RAM available for new processes
        # node_memory_MemTotal_bytes = total RAM
        # When available RAM is less than 10% of total, alert fires
        expr: |
          (
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          ) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Only {{ $value | humanize }}% memory available. Check for memory leaks: docker stats"

      - alert: DiskSpaceLow
        # Fires when disk is more than 75% full
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) * 100 < 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk is {{ $value | humanize }}% free. Clean up logs or old Docker images: docker system prune"

      - alert: DiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) * 100 < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL disk space on {{ $labels.instance }}"
          description: "Disk is almost full. Immediate action required or services will crash."

  # ─── LLM / RAG Alerts ─────────────────────────────────────────────────────
  # These are LLMOps alerts — monitoring the AI layer, not just infrastructure.
  # This is what separates an MLOps engineer from a plain DevOps engineer.
  - name: llm_health
    rules:

      - alert: LLMHighErrorRate
        # If more than 10% of LLM API calls are failing, something is wrong.
        # Common causes: Groq API key expired, rate limit hit, network issue.
        expr: |
          (
            rate(llm_requests_total{status="error"}[5m])
            /
            rate(llm_requests_total[5m])
          ) * 100 > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High LLM error rate on RAGService"
          description: "LLM error rate is {{ $value | humanize }}%. Check Groq API key and quota at console.groq.com"

      - alert: LLMHighLatency
        # p95 > 15 seconds means most users are waiting too long.
        # Groq normally responds in 1-3 seconds. Spike = throttling or overload.
        expr: |
          histogram_quantile(0.95,
            rate(llm_request_duration_seconds_bucket[5m])
          ) > 15
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High LLM response latency (p95 > 15s)"
          description: "95th percentile LLM latency is {{ $value | humanizeDuration }}. Groq may be throttling requests."

      - alert: RAGHighUngroundedRate
        # If more than 50% of answers are not grounded in retrieved context,
        # the knowledge base is too sparse — need to ingest more documents.
        # This is a MODEL QUALITY alert, not an infrastructure alert.
        expr: |
          (
            rate(rag_queries_total{grounded="false"}[10m])
            /
            rate(rag_queries_total[10m])
          ) * 100 > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High RAG ungrounded response rate ({{ $value | humanize }}%)"
          description: "Over half of RAG answers are not grounded in retrieved context. Use POST /ingest to add more runbooks or incident logs."

      - alert: RAGServiceDown
        expr: up{job="ragservice"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RAGService is down"
          description: "The AI incident assistant is unreachable. Check: docker logs ragservice"

  # ─── No Logs Alert ─────────────────────────────────────────────────────────
  - name: observability
    rules:

      - alert: LokiDown
        # Prometheus scrapes Loki's /metrics endpoint.
        # up == 0 means Loki is unreachable — logs are not being stored.
        # When Loki is down, all LogQL queries in Grafana fail silently.
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Loki log storage is down"
          description: "Loki has been unreachable for 2 minutes. Logs are not being stored. Check: docker logs loki"
