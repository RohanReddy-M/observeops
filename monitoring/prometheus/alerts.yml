# ─── Prometheus Alert Rules ───────────────────────────────────────────────────
# Alert rules define CONDITIONS that, when true for a certain duration,
# trigger an alert that gets sent to AlertManager.
#
# Structure of each alert:
#   alert: name of the alert (shown in Slack/Grafana)
#   expr:  PromQL expression - when this is TRUE, alert is "pending"
#   for:   how long expr must be true before alert "fires" (avoids flapping)
#   labels: metadata attached to the alert (severity, team, etc.)
#   annotations: human-readable description shown in notification

groups:

  # ─── Service Availability Alerts ──────────────────────────────────────────
  - name: service_availability
    rules:

      - alert: ServiceDown
        # up == 0 means Prometheus couldn't scrape the target
        # This means the service is completely unreachable
        expr: up == 0
        for: 1m    # Must be down for 1 full minute (avoids brief restart flaps)
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been unreachable for more than 1 minute. Check if the container is running: docker ps | grep {{ $labels.job }}"
          runbook_url: "https://github.com/RohanReddy-M/observeops/blob/main/docs/runbooks/service-down.md"

      - alert: ContainerRestartingFrequently
        # process_start_time_seconds is exported by every Python service's /metrics
        # (prometheus_client's default process collector) and changes exactly when
        # the process restarts, so changes() over a window counts restarts.
        #
        # This rule used to query kube_pod_container_status_restarts_total, a
        # kube-state-metrics series that does not exist in this Docker Compose
        # deployment. It could never fire: it looked like coverage and was none.
        #
        # It complements ServiceDown rather than duplicating it. A container that
        # never stays up long enough to be scraped shows as up == 0; one that comes
        # up, serves briefly and dies again is what this catches.
        expr: changes(process_start_time_seconds{job=~"secureship|statusservice|ragservice|llm-alert-autopilot"}[15m]) >= 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} restarted {{ $value }} times in 15 minutes"
          description: "{{ $labels.job }} is restart-looping. Read the logs of the container that died, not the one running now: docker logs --tail 100 {{ $labels.job }}, and check 'docker inspect {{ $labels.job }}' for OOMKilled and the exit code."

  # ─── Error Rate Alerts ─────────────────────────────────────────────────────
  - name: error_rates
    rules:

      - alert: HighErrorRate
        # This PromQL expression:
        # 1. Gets the rate of 5xx requests per second over 5 minutes
        # 2. Divides by total request rate to get a percentage
        # 3. Fires if error rate > 5%
        #
        # Both sides MUST be aggregated to the same labels before dividing. Written
        # as a bare rate() / rate(), PromQL matches series on identical label sets,
        # so each 5xx series was divided by itself: the result was 100% whenever a
        # single 5xx existed and the threshold was meaningless.
        expr: |
          (
            sum by (job) (rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_requests_total[5m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanize }}% for {{ $labels.job }}. Normal is < 1%. Check logs in Grafana Loki dashboard."

      - alert: CriticalErrorRate
        expr: |
          (
            sum by (job) (rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            sum by (job) (rate(http_requests_total[5m]))
          ) * 100 > 25
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanize }}% - service is degraded significantly."

      - alert: StatusServiceHighErrorRate
        # StatusService emits status_requests_total with label 'status' (not status_code).
        # Separate alert covers the /fail endpoint simulated errors.
        expr: |
          (
            sum by (job) (rate(status_requests_total{status="500"}[5m]))
            /
            sum by (job) (rate(status_requests_total[5m]))
          ) * 100 > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "StatusService high error rate ({{ $value | humanize }}%)"
          description: "StatusService /fail endpoint is returning errors above threshold. Check FAILURE_RATE env var."

  # ─── Latency Alerts ────────────────────────────────────────────────────────
  - name: latency
    rules:

      - alert: HighLatency
        # histogram_quantile calculates the 99th percentile latency
        # p99 > 2 seconds means 1% of requests take more than 2 seconds
        # This catches slow queries, memory pressure, etc.
        # Buckets are summed per service first. Without the sum, this computed a
        # separate p99 for every method and endpoint, so one rarely-hit slow route
        # could page for the whole service.
        expr: |
          histogram_quantile(0.99,
            sum by (le, job) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency on {{ $labels.job }}"
          description: "99th percentile latency is {{ $value | humanizeDuration }} for {{ $labels.job }}. Check if the instance is CPU or memory constrained."

  # ─── Infrastructure Alerts ─────────────────────────────────────────────────
  - name: infrastructure
    rules:

      - alert: HighCPUUsage
        # node_cpu_seconds_total tracks CPU time by mode (idle, user, system, etc.)
        # This expression calculates the percentage of time NOT spent idle
        expr: |
          (
            1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
            by (instance, host)
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.host }}"
          description: "CPU usage is {{ $value | humanize }}%. Run 'top' on the instance to identify the consuming process."

      - alert: HighMemoryUsage
        # node_memory_MemAvailable_bytes = RAM available for new processes
        # node_memory_MemTotal_bytes = total RAM
        # When available RAM is less than 10% of total, alert fires
        expr: |
          (
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          ) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.host }}"
          description: "Only {{ $value | humanize }}% memory available. Check for memory leaks: docker stats"

      - alert: DiskSpaceLow
        # Fires when disk is more than 75% full
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) * 100 < 25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.host }}"
          description: "Disk is {{ $value | humanize }}% free. Clean up logs or old Docker images: docker system prune"

      - alert: DiskSpaceCritical
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) * 100 < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL disk space on {{ $labels.host }}"
          description: "Disk is almost full. Immediate action required or services will crash."

  # ─── LLM / RAG Alerts ─────────────────────────────────────────────────────
  # These are LLMOps alerts — monitoring the AI layer, not just infrastructure.
  # This is what separates an MLOps engineer from a plain DevOps engineer.
  - name: llm_health
    rules:

      - alert: LLMHighErrorRate
        # If more than 10% of LLM API calls are failing, something is wrong.
        # Common causes: Groq API key expired, rate limit hit, network issue.
        # Aggregated before dividing, for the same reason as HighErrorRate above.
        expr: |
          (
            sum by (job) (rate(llm_requests_total{status="error"}[5m]))
            /
            sum by (job) (rate(llm_requests_total[5m]))
          ) * 100 > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High LLM error rate on RAGService"
          description: "LLM error rate is {{ $value | humanize }}%. Check Groq API key and quota at console.groq.com"

      - alert: LLMHighLatency
        # p95 > 15 seconds means most users are waiting too long.
        # Groq normally responds in 1-3 seconds. Spike = throttling or overload.
        expr: |
          histogram_quantile(0.95,
            rate(llm_request_duration_seconds_bucket[5m])
          ) > 15
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High LLM response latency (p95 > 15s)"
          description: "95th percentile LLM latency is {{ $value | humanizeDuration }}. Groq may be throttling requests."

      - alert: AutopilotDiagnosisFailing
        # The autopilot turns alerts into a diagnosis in Slack. When its LLM call
        # fails, the alert itself still reaches Slack through the plain route, so
        # nothing looks broken: the diagnosis is simply missing. That is how the
        # model this service called could be retired by the provider and stay
        # unnoticed. Any diagnosis error in the window is worth a warning, because
        # in normal operation there are none.
        expr: sum by (job) (increase(autopilot_diagnosis_errors_total[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "LLM alert diagnosis is failing ({{ $value | humanize }} errors in 15m)"
          description: "llm-alert-autopilot received alerts but could not diagnose them. Alerts are still delivered, without a diagnosis. Check: docker logs --tail 50 llm-alert-autopilot. Common causes: the GROQ_MODEL no longer exists at the provider, the API key was revoked, or Loki is unreachable."

      - alert: RAGHighUngroundedRate
        # If more than 50% of answers are not grounded in retrieved context,
        # the knowledge base is too sparse — need to ingest more documents.
        # This is a MODEL QUALITY alert, not an infrastructure alert.
        expr: |
          (
            sum by (job) (rate(rag_queries_total{grounded="false"}[10m]))
            /
            sum by (job) (rate(rag_queries_total[10m]))
          ) * 100 > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High RAG ungrounded response rate ({{ $value | humanize }}%)"
          description: "Over half of RAG answers are not grounded in retrieved context. Use POST /ingest to add more runbooks or incident logs."

      - alert: RAGServiceDown
        expr: up{job="ragservice"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RAGService is down"
          description: "The AI incident assistant is unreachable. Check: docker logs ragservice"

      - alert: RAGIndexEmpty
        # Fires when RAGService is UP but has zero documents in its FAISS index.
        # This is a "zombie recovery" state — the service appears healthy but
        # cannot answer any questions. Discovered during chaos experiment 2026-05-31.
        # Root cause: FAISS is in-memory only and is lost on every container restart.
        # Fix: re-deploy (auto-ingest runs) or POST runbooks to /ingest manually.
        expr: |
          up{job="ragservice"} == 1
          and
          vector_store_documents_total == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RAGService is up but knowledge base is empty (0 documents)"
          description: "RAGService is running but the FAISS index has no documents. All queries will return 'I don't have enough context'. Fix: sudo docker compose -f /opt/observeops/docker-compose.yml restart ragservice (auto-ingest will repopulate)"

  # ─── Deadman Switch ────────────────────────────────────────────────────────
  # The hardest problem in monitoring: how do you know your monitoring system itself is alive?
  #
  # The Watchdog alert solves this. It always fires — `vector(1)` is always true.
  # AlertManager receives it every minute and routes it to a sink that pings healthchecks.io.
  # If Prometheus dies, AlertManager dies, or the network between them breaks —
  # the pings stop, and healthchecks.io emails/Slacks you within 5 minutes.
  #
  # This is the difference between monitoring and reliable monitoring.
  # Without a deadman switch, your monitoring can be dead and you won't know.
  - name: deadman_switch
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog — confirms Prometheus and AlertManager pipeline is alive"
          description: "This alert always fires. If it stops appearing in AlertManager, the alerting pipeline is broken. Route this to healthchecks.io in production."

  # ─── No Logs Alert ─────────────────────────────────────────────────────────
  - name: observability
    rules:

      - alert: LokiDown
        # Prometheus scrapes Loki's /metrics endpoint.
        # up == 0 means Loki is unreachable — logs are not being stored.
        # When Loki is down, all LogQL queries in Grafana fail silently.
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Loki log storage is down"
          description: "Loki has been unreachable for 2 minutes. Logs are not being stored. Check: docker logs loki"

  # ─── SLO Breach Alerts ──────────────────────────────────────────────────────
  # These fire when services violate their reliability contracts.
  # They use pre-computed recording rules from slo-rules.yml for instant evaluation.
  - name: slo_breach
    rules:

      - alert: SecureShipSLOBreach
        # Fires when 5-minute availability drops below 99.5% for 5 minutes.
        # Unlike HighErrorRate (fires on spikes), this fires on sustained degradation.
        expr: slo:secureship_availability:ratio_rate5m < 0.995
        for: 5m
        labels:
          severity: critical
          slo: "true"
        annotations:
          summary: "SecureShip availability SLO breached ({{ $value | humanizePercentage }})"
          description: "Availability is {{ $value | humanizePercentage }}, below 99.5% SLO target. Error budget is being consumed. Check error rate and recent deploys."
          runbook_url: "https://github.com/RohanReddy-M/observeops/blob/main/docs/runbooks/service-down.md"

      - alert: SecureShipErrorBudgetLow
        # Fires when less than 20% of the monthly error budget remains.
        # At this point: avoid risky deploys, investigate ongoing issues.
        # This is the "slow burn" alert — catches gradual reliability decay.
        expr: slo:secureship_availability:error_budget_pct < 20
        for: 0m
        labels:
          severity: warning
          slo: "true"
        annotations:
          summary: "SecureShip error budget below 20% ({{ $value | humanize }}% remaining)"
          description: "Only {{ $value | humanize }}% of the 216-minute monthly error budget remains. Avoid feature deploys. Investigate error sources in Grafana → SLO Dashboard."

      - alert: SecureShipBurnRateTooHigh
        # Two-window burn rate alert (Google SRE Workbook §6.2).
        # BOTH windows must exceed their thresholds before paging — this eliminates
        # false positives from brief traffic spikes that inflate the 1h window alone.
        # 1h > 14.4 AND 6h > 6:  fast burn — budget exhausted in ~50h  → page now
        # Using AND means: sustained burn (confirmed by 6h), not a momentary spike.
        expr: |
          slo:secureship_availability:burn_rate1h > 14.4
          and
          slo:secureship_availability:burn_rate6h > 6
        for: 2m
        labels:
          severity: critical
          slo: "true"
        annotations:
          summary: "SecureShip burn rate critical (1h: {{ $value | humanize }}x)"
          description: "Error budget burning fast on both 1h and 6h windows. Monthly budget will be exhausted in hours. Check error rate and recent deploys immediately."

      - alert: RAGServiceSuccessSLOBreach
        expr: slo:ragservice_success:ratio_rate5m < 0.95
        for: 5m
        labels:
          severity: warning
          slo: "true"
        annotations:
          summary: "RAGService query success SLO breached ({{ $value | humanizePercentage }})"
          description: "Query success rate {{ $value | humanizePercentage }} is below 95% target. Groq API may be throttling. Check console.groq.com for quota usage."
