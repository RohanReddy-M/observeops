# ─── Prometheus Configuration ─────────────────────────────────────────────────
# Prometheus works by PULLING metrics from targets (scraping).
# This file tells Prometheus:
# 1. How often to scrape (global interval)
# 2. WHERE to scrape (scrape_configs)
# 3. Which alert rules to evaluate (rule_files)
# 4. Where to send alerts (alerting)

global:
  # How often Prometheus collects metrics from each target
  scrape_interval: 15s
  
  # How often Prometheus evaluates alert rules
  evaluation_interval: 15s
  
  # Labels added to ALL metrics collected by this Prometheus instance
  # Useful when you have multiple Prometheus servers
  external_labels:
    environment: 'production'
    project: 'observeops'

# ─── Alert Rules ──────────────────────────────────────────────────────────────
# Prometheus loads these files and evaluates rules every evaluation_interval
rule_files:
  - "/etc/prometheus/alerts.yml"
  - "/etc/prometheus/slo-rules.yml"

# ─── AlertManager Integration ─────────────────────────────────────────────────
# When an alert rule fires, Prometheus sends it to AlertManager
# AlertManager then decides how/where to route the notification (Slack, email, etc.)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093    # Container name resolves via Docker DNS

# ─── Scrape Configurations ────────────────────────────────────────────────────
# Each job defines a set of targets to scrape.
# Prometheus will hit <target>/metrics every scrape_interval seconds.

scrape_configs:

  # ─── Prometheus scrapes ITSELF ──────────────────────────────────────────────
  # Meta! This lets you monitor Prometheus's own health and performance.
  - job_name: 'prometheus'
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # ─── SecureShip ─────────────────────────────────────────────────────────────
  # Prometheus runs on the obs server; SecureShip runs on the app server.
  # Container DNS does not cross Docker hosts — use the app server private IP.
  - job_name: 'secureship'
    static_configs:
      - targets: ['__APP_SERVER_IP__:8001']
        labels:
          service: 'secureship'
          team: 'backend'
    metrics_path: '/metrics'

  # ─── StatusService ──────────────────────────────────────────────────────────
  - job_name: 'statusservice'
    static_configs:
      - targets: ['__APP_SERVER_IP__:8002']
        labels:
          service: 'statusservice'
          team: 'backend'

  # ─── Node Exporter ──────────────────────────────────────────────────────────
  # Node exporter exposes Linux system metrics:
  # CPU usage, memory, disk space, network traffic, etc.
  # This is your infrastructure-level monitoring (as opposed to app-level)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          instance_type: 'app-server'

  # ─── Nginx ──────────────────────────────────────────────────────────────────
  # Nginx doesn't expose Prometheus metrics by default.
  # We use nginx-prometheus-exporter as a sidecar for this.
  # For now, we monitor nginx via its access logs in Loki instead.

  # ─── RAGService ─────────────────────────────────────────────────────────────
  # Scrapes LLMOps metrics: llm_request_duration_seconds, llm_requests_total,
  # rag_queries_total, rag_documents_retrieved, vector_store_documents_total
  - job_name: 'ragservice'
    static_configs:
      - targets: ['__APP_SERVER_IP__:8003']
        labels:
          service: 'ragservice'
          team: 'ai'

  # ─── Grafana ────────────────────────────────────────────────────────────────
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # ─── LLM Alert Autopilot ────────────────────────────────────────────────────
  - job_name: 'llm-alert-autopilot'
    static_configs:
      - targets: ['__APP_SERVER_IP__:8080']
        labels:
          service: 'llm-alert-autopilot'
          team: 'ai'

  # ─── Loki ───────────────────────────────────────────────────────────────────
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # ─── AlertManager ───────────────────────────────────────────────────────────
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'

  # ─── OTel Collector ─────────────────────────────────────────────────────────
  # Exposes collector internals: spans received, export failures, queue depth.
  # Catches trace pipeline issues before they silently drop data.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['__APP_SERVER_IP__:8888']
        labels:
          service: 'otel-collector'

  # ─── Tempo ──────────────────────────────────────────────────────────────────
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: 'tempo'
