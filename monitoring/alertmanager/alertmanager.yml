# ─── AlertManager Configuration ──────────────────────────────────────────────
# AlertManager receives alerts FROM Prometheus and routes them to receivers.
# Prometheus detects the problem.
# AlertManager decides: who gets notified, how, and how often.
#
# This file is identical in local development and in production. Nothing rewrites
# it at deploy time:
#   - "app-server" resolves via extra_hosts in docker-compose.yml (the Docker host
#     locally, the application server's private IP in production).
#   - Webhook URLs are secrets and are read from files under
#     /etc/alertmanager/secrets at notify time. See secrets/README.md.

global:
  # How long AlertManager keeps an alert active after it stops receiving it from
  # Prometheus, before declaring it resolved on its own.
  resolve_timeout: 5m

# ─── Routing Tree ─────────────────────────────────────────────────────────────
# Every alert enters at the root route and is compared with the sub-routes in
# order. The first one whose matchers fit takes it and the search stops, unless
# that route says `continue: true`, in which case later routes are tried as well.
# An alert that fits no sub-route is handled by the root route's own receiver.
route:
  # Default: the null receiver, for alerts that match no severity route.
  receiver: 'null'

  # Group alerts together to avoid notification spam.
  # All alerts with same alertname+job get grouped into one notification.
  group_by: ['alertname', 'job']

  # Wait 30s after the FIRST alert of a new group before notifying, to collect
  # related alerts into one message. This delays the notification only: the alert
  # is already visible in AlertManager's API and UI the moment Prometheus sends it.
  group_wait: 30s

  # Wait 5m before notifying about NEW alerts added to an already-notified group
  group_interval: 5m

  # Wait 4h before re-sending a notification for alerts that are still firing
  repeat_interval: 4h

  # ─── Sub-routes ─────────────────────────────────────────────────────────────
  routes:
    # Watchdog deadman switch: intercepted BEFORE llm-autopilot so it is never
    # "diagnosed" by the LLM (it is not a real alert) and never reaches Slack.
    # It is re-sent every 5 minutes to an external heartbeat monitor; if those
    # pings stop, the external service raises the alarm that this stack cannot
    # raise about itself.
    - matchers:
        - alertname = "Watchdog"
      receiver: 'watchdog-sink'
      group_wait: 0s
      repeat_interval: 5m
      continue: false

    # All other alerts go through LLM Alert Autopilot first for AI diagnosis
    - receiver: 'llm-autopilot'
      continue: true

    # Critical alerts go to Slack critical channel
    - matchers:
        - severity = "critical"
      receiver: 'slack-critical'
      repeat_interval: 1h

    # Warning alerts go to Slack warnings channel
    - matchers:
        - severity = "warning"
      receiver: 'slack-warnings'

# ─── Receivers ────────────────────────────────────────────────────────────────
# Receivers define WHERE and HOW to send notifications

receivers:
  # Null receiver: silently accepts alerts, sends nothing.
  - name: 'null'

  # Watchdog sink: the external leg of the deadman switch.
  # The ping URL lives in SSM at /observeops/production/healthchecks_url and is
  # written to this file by user_data on the observability server. Until that
  # parameter exists the file is absent, every ping attempt fails, and AlertManager
  # logs a notify error every 5 minutes. That noise is deliberate: a deadman switch
  # that is not connected to anything should not be quiet about it.
  #
  # To connect it (healthchecks.io free tier, or any heartbeat monitor):
  #   1. Create a check with period 5 minutes and grace 10 minutes
  #   2. aws ssm put-parameter --type SecureString \
  #        --name /observeops/production/healthchecks_url --value '<ping URL>'
  #   3. Rebuild the observability server, or write the URL to
  #      monitoring/alertmanager/secrets/healthchecks_url and reload AlertManager
  - name: 'watchdog-sink'
    webhook_configs:
      - url_file: '/etc/alertmanager/secrets/healthchecks_url'
        send_resolved: false

  # LLM Alert Autopilot: webhook receiver on the application server. It queries
  # Loki for log context, calls the LLM for a diagnosis and posts it to Slack.
  #
  # send_resolved MUST be true. The autopilot computes MTTR from resolved
  # notifications (startsAt -> endsAt); with send_resolved false it never received
  # one, alert_mttr_seconds never got an observation, and the MTTR panels on the
  # DORA dashboard stayed empty. Resolved alerts are only recorded, never sent to
  # the LLM.
  - name: 'llm-autopilot'
    webhook_configs:
      - url: 'http://app-server:8080/webhook'
        send_resolved: true

  - name: 'slack-critical'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_critical'
        channel: '#alerts-critical'
        # The title carries the state. With send_resolved on, a title that only says
        # "CRITICAL" makes the all-clear look exactly like a second alarm.
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] CRITICAL {{ .GroupLabels.alertname }}{{ if .GroupLabels.job }} ({{ .GroupLabels.job }}){{ end }}'
        # What is wrong, what to check first, and the runbook: enough to start
        # working from the notification without opening Prometheus.
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}{{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        send_resolved: true

  - name: 'slack-warnings'
    slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/slack_webhook_warnings'
        channel: '#alerts-warnings'
        # The title carries the state. With send_resolved on, a title that only says
        # "CRITICAL" makes the all-clear look exactly like a second alarm.
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] WARNING {{ .GroupLabels.alertname }}{{ if .GroupLabels.job }} ({{ .GroupLabels.job }}){{ end }}'
        # What is wrong, what to check first, and the runbook: enough to start
        # working from the notification without opening Prometheus.
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}{{ if .Annotations.runbook_url }}
          Runbook: {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        send_resolved: true

# ─── Inhibition Rules ─────────────────────────────────────────────────────────
# Inhibition suppresses certain alerts when other alerts are firing.
# Example: If ServiceDown is firing, don't also send HighErrorRate
# (the service being down IS the cause of the errors - don't double-alert)
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    # If a critical alert fires for job X, suppress all warnings for job X.
    # 'alertname' must NOT be in equal — source (ServiceDown) and target
    # (HighErrorRate) have different names, so equal: ['alertname','job']
    # would never match and the inhibition would silently never trigger.
    equal: ['job']
