apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observeops
  namespace: observeops
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    # Get the cert ARN after terraform apply:
    #   terraform -chdir=terraform output -raw acm_certificate_arn
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:198239799708:certificate/REPLACE_WITH_TERRAFORM_OUTPUT"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    argocd.argoproj.io/sync-wave: "3"  # Last — only useful once all services are healthy
spec:
  # ingressClassName replaces the deprecated kubernetes.io/ingress.class annotation (removed in K8s 1.22+)
  # Requires AWS Load Balancer Controller installed on the EKS cluster
  ingressClassName: alb
  rules:
    - host: secureship.click
      http:
        paths:
          # AI/RAG endpoints — LLM calls can take 5-30s so these must
          # hit ragservice directly, not the main API
          - path: /ai/
            pathType: Prefix
            backend:
              service:
                name: ragservice
                port:
                  number: 8003

          # Status/metrics endpoints
          - path: /status/
            pathType: Prefix
            backend:
              service:
                name: statusservice
                port:
                  number: 8002

          # All other traffic goes to the main API
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secureship
                port:
                  number: 8001
