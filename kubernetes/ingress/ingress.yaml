apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observeops
  namespace: observeops
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    # Cert ARN is injected by bootstrap.sh from terraform output.
    # To get it manually: terraform -chdir=terraform output -raw acm_certificate_arn
    alb.ingress.kubernetes.io/certificate-arn: "__ACM_CERT_ARN__"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    argocd.argoproj.io/sync-wave: "3"  # Last — only useful once all services are healthy
spec:
  # ingressClassName replaces the deprecated kubernetes.io/ingress.class annotation (removed in K8s 1.22+)
  # Requires AWS Load Balancer Controller installed on the EKS cluster
  ingressClassName: alb
  rules:
    - host: secureship.click
      http:
        paths:
          # AI/RAG endpoints — LLM calls can take 5-30s so these must
          # hit ragservice directly, not the main API
          - path: /ai/
            pathType: Prefix
            backend:
              service:
                name: ragservice
                port:
                  number: 8003

          # Status/metrics endpoints
          - path: /status/
            pathType: Prefix
            backend:
              service:
                name: statusservice
                port:
                  number: 8002

          # Grafana is configured for this exact subpath (GF_SERVER_ROOT_URL /
          # GF_SERVER_SERVE_FROM_SUB_PATH in kubernetes/monitoring/grafana/
          # deployment.yaml), but no rule routed here — requests to /grafana/
          # were falling through to the catch-all / rule below and hitting
          # secureship instead of Grafana.
          - path: /grafana/
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

          # All other traffic goes to the main API
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secureship
                port:
                  number: 8001
