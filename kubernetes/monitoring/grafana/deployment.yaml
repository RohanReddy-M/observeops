apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: observeops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observeops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # No securityContext existed here at all — the app deployments (secureship
      # etc.) are fully hardened, monitoring wasn't, an inconsistency worth
      # closing. Not forcing runAsUser like the app pods do: this image already
      # defaults to a non-root UID internally (472), and forcing a different one
      # risks a permission mismatch against files the image itself owns.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: grafana
          # Pinned to the same version already vetted in docker-compose.yml —
          # was :latest, which breaks reproducible deploys and risked an
          # unplanned version jump on any ArgoCD selfHeal/redeploy.
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: admin-password
            - name: GF_SERVER_ROOT_URL
              value: "https://secureship.click/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          # Previously missing entirely — a hung Grafana process would just sit
          # marked not-ready forever with nothing ever restarting it.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observeops
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
# grafana-secret is intentionally NOT defined here. It previously shipped as a
# real Secret object with the literal value "change-me-in-production" committed
# to git — that's a real password in source control, and (per its own name) one
# an operator could easily forget to actually change. It's created out-of-band
# by kubernetes/bootstrap.sh instead, the exact same pattern already used for
# observeops-secrets (GROQ_API_KEY) below it in that script — never committed,
# generated fresh if not supplied.
