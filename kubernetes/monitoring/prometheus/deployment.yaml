apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: observeops
spec:
  accessModes:
    - ReadWriteOnce
  # On EKS this provisions an EBS gp3 volume automatically via the EBS CSI driver
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observeops
spec:
  # Single replica — Prometheus is stateful. For HA use Thanos or VictoriaMetrics.
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      # This image already defaults to a non-root UID (65534, "nobody")
      # internally, so runAsNonRoot enforces that without forcing a specific
      # UID that could conflict with files the image itself owns.
      securityContext:
        runAsNonRoot: true
      containers:
        - name: prometheus
          # Pinned to the version already vetted in docker-compose.yml — was
          # :latest, which breaks reproducible deploys.
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
          # Prometheus ships a separate /-/healthy endpoint specifically for
          # liveness (distinct from /-/ready) — previously no livenessProbe
          # existed at all, so a hung WAL compaction or TSDB corruption would
          # leave Prometheus unready forever with nothing ever restarting it.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observeops
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
