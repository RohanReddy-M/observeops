---
# Allow all pods to reach AWS APIs (DynamoDB, SSM, ECR) and the Groq API.
# Without this, the default-deny policy blocks all outbound traffic.
# Port 443 covers all AWS regional endpoints and external HTTPS APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-aws-and-external
  namespace: observeops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# Allow pods to talk to each other within the namespace.
# RAGService needs to reach secureship for internal queries.
#
# NOTE: this is intentionally broad (any pod, any port, both directions) and it
# currently supersedes the more specific allow-prometheus-scrape-* policies in
# allow-monitoring.yaml — those exist to express "only Prometheus may reach the
# app pods' metrics port," but this rule already grants that access to every
# pod regardless, so the namespace has no real internal segmentation today
# despite looking like it does. Narrowing this to only what's actually needed
# (which specific pod needs which specific port on which other pod) requires
# verifying the real call graph against a live cluster rather than guessing at
# it from the manifests alone — left as full-mesh rather than risk silently
# breaking a legitimate call path this comment doesn't fully enumerate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: observeops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
