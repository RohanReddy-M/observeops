---
# Allow Prometheus (in the monitoring namespace) to scrape /metrics from all app pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-secureship
  namespace: observeops
spec:
  podSelector:
    matchLabels:
      app: secureship
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8001
          protocol: TCP

