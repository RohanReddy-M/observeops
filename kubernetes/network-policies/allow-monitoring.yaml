---
# Allow Prometheus to scrape /metrics from all app pods.
#
# These previously scoped `from:` with a namespaceSelector for a `monitoring`
# namespace — but everything in this project (apps AND monitoring) deploys into
# the single `observeops` namespace (see kubernetes/namespace.yaml and
# kubernetes/monitoring/*/deployment.yaml). No `monitoring` namespace was ever
# created, so that selector never matched anything and these three policies were
# silent dead code — scraping only worked because allow-intra-namespace.yaml's
# far broader "any pod to any pod" rule was already covering the gap underneath
# them. Same-namespace traffic doesn't need a namespaceSelector at all — the
# podSelector below already implicitly scopes to this policy's own namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape-secureship
  namespace: observeops
spec:
  podSelector:
    matchLabels:
      app: secureship
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8001
          protocol: TCP

