---
# Allow the ALB to reach application pods.
#
# These previously restricted `from:` to a namespaceSelector for the
# ingress-nginx controller — correct for local/kind clusters, but production
# uses the AWS Load Balancer Controller with `alb.ingress.kubernetes.io/target-type:
# "ip"` (see kubernetes/ingress/ingress.yaml), where the ALB's ENIs send traffic
# directly to pod IPs from outside the cluster entirely. No ingress-nginx pod is
# ever involved in that path, so the old namespaceSelector never matched and,
# once default-deny is enforced, would have silently dropped all real production
# traffic. Scope by the VPC CIDR instead — matches terraform's var.vpc_cidr
# default (10.0.0.0/16); update this if that variable is ever changed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-secureship
  namespace: observeops
spec:
  podSelector:
    matchLabels:
      app: secureship
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 8001
          protocol: TCP

