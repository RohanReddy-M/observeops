apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureship
  namespace: observeops
  labels:
    app: secureship
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # After Service so DNS is ready when pods register
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureship
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: secureship
    spec:
      # eks/cluster.yaml provisions this IRSA-bound service account, but nothing
      # actually used it — every pod ran as the namespace's `default` account
      # instead, leaving the IRSA setup dead and secureship with no IAM identity
      # of its own for its DynamoDB calls in the K8s path.
      serviceAccountName: observeops-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: secureship
      containers:
        - name: secureship
          image: 198239799708.dkr.ecr.ap-south-1.amazonaws.com/observeops/secureship:b41c039
          ports:
            - containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Readiness asks whether this pod can serve requests right now, so it checks
          # DynamoDB (/ready). A pod that cannot reach the table is taken out of the
          # Service's endpoints instead of receiving traffic and answering 503.
          # Liveness (below) stays on /health, which touches nothing: restarting a pod
          # because a dependency is down would only turn an outage into a restart loop.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8001"
            - name: DYNAMODB_TABLE
              value: "observeops-ships"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observeops-config
                  key: OBS_SERVER_OTLP_ENDPOINT
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
