apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureship
  namespace: observeops
  labels:
    app: secureship
  annotations:
    argocd.argoproj.io/sync-wave: "1"  # After Service so DNS is ready when pods register
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureship
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: secureship
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: secureship
          image: 198239799708.dkr.ecr.ap-south-1.amazonaws.com/observeops/secureship:6e55218
          ports:
            - containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: APP_ENV
              value: "production"
            - name: PORT
              value: "8001"
            - name: DYNAMODB_TABLE
              value: "observeops-ships"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
