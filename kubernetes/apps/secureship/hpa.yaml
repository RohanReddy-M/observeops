apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureship
  namespace: observeops
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After Deployment exists (HPA targets the Deployment)
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureship
  minReplicas: 2
  maxReplicas: 10

  metrics:
    # Scale out when average CPU across all pods exceeds 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Also scale on memory — useful for request-heavy FastAPI workloads
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      # Scale up fast — don't let users wait during a traffic spike
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      # Scale down slowly — avoid thrashing during brief traffic dips
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
