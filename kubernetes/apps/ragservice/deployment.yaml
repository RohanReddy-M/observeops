apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragservice
  namespace: observeops
  labels:
    app: ragservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ragservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "ai"
          effect: "NoSchedule"
      nodeSelector:
        role: ai
      containers:
        - name: ragservice
          image: 198239799708.dkr.ecr.ap-south-1.amazonaws.com/observeops/ragservice:2308b3c
          ports:
            - containerPort: 8003
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8003
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            periodSeconds: 30
          env:
            - name: APP_ENV
              value: "production"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: observeops-secrets
                  key: GROQ_API_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observeops-config
                  key: OBS_SERVER_OTLP_ENDPOINT
            # Create the secret before deploying:
            # kubectl create secret generic observeops-secrets \
            #   --from-literal=GROQ_API_KEY=<your-key> -n observeops
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ragservice
  namespace: observeops
spec:
  type: ClusterIP
  selector:
    app: ragservice
  ports:
    - port: 8003
      targetPort: 8003
