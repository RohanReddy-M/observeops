apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragservice
  namespace: observeops
  labels:
    app: ragservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ragservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "ai"
          effect: "NoSchedule"
      nodeSelector:
        role: ai
      containers:
        - name: ragservice
          image: ECR_REGISTRY/observeops/ragservice:IMAGE_TAG
          ports:
            - containerPort: 8003
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 60
            periodSeconds: 30
          env:
            - name: APP_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: ragservice
  namespace: observeops
spec:
  type: ClusterIP
  selector:
    app: ragservice
  ports:
    - port: 8003
      targetPort: 8003
