apiVersion: apps/v1
kind: Deployment
metadata:
  name: statusservice
  namespace: observeops
  labels:
    app: statusservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: statusservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: statusservice
    spec:
      serviceAccountName: observeops-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # secureship has this (see its own deployment.yaml); statusservice didn't,
      # so both of its replicas could land on the same node with nothing
      # protecting against a single node failure taking the "2 replica" service
      # down entirely.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: statusservice
      containers:
        - name: statusservice
          image: 198239799708.dkr.ecr.ap-south-1.amazonaws.com/observeops/statusservice:4b44361
          ports:
            - containerPort: 8002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            # secureship and ragservice both wire this from observeops-config;
            # statusservice never did, so it silently produced no OTel traces
            # even though the rest of the architecture assumes all three
            # services are instrumented consistently.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observeops-config
                  key: OBS_SERVER_OTLP_ENDPOINT
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: statusservice
  namespace: observeops
spec:
  type: ClusterIP
  selector:
    app: statusservice
  ports:
    - port: 8002
      targetPort: 8002
