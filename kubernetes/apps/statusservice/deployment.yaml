apiVersion: apps/v1
kind: Deployment
metadata:
  name: statusservice
  namespace: observeops
  labels:
    app: statusservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: statusservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: statusservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: statusservice
          image: 198239799708.dkr.ecr.ap-south-1.amazonaws.com/observeops/statusservice:c68e154
          ports:
            - containerPort: 8002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: statusservice
  namespace: observeops
spec:
  type: ClusterIP
  selector:
    app: statusservice
  ports:
    - port: 8002
      targetPort: 8002
