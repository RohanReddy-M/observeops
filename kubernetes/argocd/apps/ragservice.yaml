apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ragservice
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After wave-1 services — needs observeops-secrets Secret to exist
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observeops
  source:
    repoURL: https://github.com/RohanReddy-M/observeops
    targetRevision: HEAD
    path: kubernetes/apps/ragservice
  destination:
    server: https://kubernetes.default.svc
    namespace: observeops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
