apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observeops-root
  namespace: argocd
  # Cascade delete — deleting this app deletes all child apps and their resources
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observeops
  source:
    repoURL: https://github.com/RohanReddy-M/observeops
    targetRevision: HEAD
    path: kubernetes/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true   # revert manual changes to cluster state
