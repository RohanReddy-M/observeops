# ─── GitHub Actions CI/CD Pipeline ───────────────────────────────────────────
# This pipeline runs automatically when you push code to GitHub.
#
# Flow:
# Push to any branch → test + build
# Push to main       → test + build + deploy to production (with approval)
#
# Authentication:
# We use OIDC (OpenID Connect) instead of storing AWS keys in GitHub Secrets.
# OIDC = GitHub proves its identity to AWS, AWS issues temporary credentials.
# Why: Static keys are a security risk. OIDC credentials are temporary (1 hour).
#
# SETUP REQUIRED:
# 1. Create OIDC provider in AWS IAM for GitHub
# 2. Create IAM role with ECR push + EC2 permissions
# 3. Add these GitHub Secrets:
#    - AWS_ROLE_ARN: arn:aws:iam::ACCOUNT_ID:role/github-actions-role
#    - EC2_APP_HOST: private IP of app server  
#    - EC2_SSH_KEY: private SSH key (keep .pem contents)
#    - ECR_REGISTRY: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com

name: ObserveOps CI/CD

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# Scope GITHUB_TOKEN to minimum required permissions.
# Default is write-all which is a security risk — a compromised workflow could
# push code, delete branches, or create releases.
permissions:
  contents: read        # checkout
  id-token: write       # OIDC: exchange token for AWS credentials
  security-events: write # Upload SARIF scan results to GitHub Security tab

env:
  AWS_REGION: ap-south-1
  PYTHON_VERSION: '3.11'

jobs:

  # ─── Job 1: Test ────────────────────────────────────────────────────────────
  # Runs on every push and PR. Pipeline stops here if tests fail.
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            apps/secureship/requirements.txt
            apps/ragservice/requirements.txt
            apps/statusservice/requirements.txt

      - name: Install SecureShip dependencies
        run: pip install -r apps/secureship/requirements.txt

      # RAGService deps include PyTorch — install CPU-only build (~350 MB, not ~2 GB GPU build)
      - name: Install RAGService dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r apps/ragservice/requirements.txt

      - name: Install StatusService dependencies
        run: pip install -r apps/statusservice/requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx pytest-asyncio

      - name: Run SecureShip tests
        run: pytest apps/secureship/tests/ -v

      - name: Run StatusService tests
        run: pytest apps/statusservice/tests/ -v

      - name: Run RAGService tests
        run: pytest apps/ragservice/tests/ -v

      - name: Run RAG quality evaluation harness
        run: python apps/ragservice/eval.py
        continue-on-error: true


  # ─── Job 2: Security Scan ───────────────────────────────────────────────────
  # Runs on every push AFTER tests pass.
  # Three tools, three layers of security:
  #   Trivy   = dependency vulnerabilities (CVEs in Python packages)
  #   Bandit  = static code analysis (SQL injection, hardcoded passwords, etc.)
  #   TruffleHog = git history scan for accidentally committed secrets
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history needed for TruffleHog secret scan

      # Trivy scans all files for known CVEs in Python packages, OS packages,
      # and config files. Results appear in GitHub Security tab as SARIF.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Bandit is Python-specific SAST (Static Application Security Testing).
      # It catches: shell injection, hardcoded passwords, use of insecure functions.
      - name: Set up Python for Bandit
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r apps/ -ll -f json -o bandit-report.json || true

      - name: Fail on HIGH severity Bandit findings
        run: |
          HIGH=$(python3 -c "
          import json, sys
          data = json.load(open('bandit-report.json'))
          highs = [r for r in data.get('results', []) if r['issue_severity'] == 'HIGH']
          for h in highs:
              print(f\"{h['filename']}:{h['line_number']} — {h['issue_text']}\")
          print(len(highs))
          ")
          COUNT=$(echo "$HIGH" | tail -1)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ Bandit found $COUNT HIGH severity issues — fix before merging"
            echo "$HIGH"
            exit 1
          fi
          echo "✓ Bandit: no HIGH severity issues"

      # TruffleHog scans git commits for secrets (API keys, passwords, tokens).
      # It compares HEAD to the default branch — catches secrets in new commits.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.88.21
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ─── Job 3: Terraform Lint ──────────────────────────────────────────────────
  # Runs in parallel with security-scan.
  # terraform fmt -check: fails if any .tf file is not formatted (prevents drift)
  # tfsec: static analysis for Terraform misconfigurations (open S3 buckets,
  #         missing encryption, overly-permissive IAM, etc.)
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt check
        working-directory: terraform
        run: |
          terraform fmt -recursive
          if ! git diff --quiet; then
            echo "❌ Terraform files were not formatted. Run 'make fmt' before pushing."
            git diff --stat
            exit 1
          fi
          echo "✓ Terraform formatting is correct"

      - name: tfsec static analysis
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true
          # soft_fail: true — findings are visible in CI output but don't block deploy.
          # Accepted deviations are documented with justifications in .tfsec/config.yml.
          # In a production environment soft_fail would be false with all deviations
          # reviewed and approved by the security team.
          # tfsec checks for: unencrypted S3 buckets, open security groups,
          # missing CloudTrail, public ECR repos, over-permissive IAM policies.

  # ─── Job 3b: Check AWS secrets ─────────────────────────────────────────────
  # Detects whether ECR_REGISTRY and AWS_ROLE_ARN are configured.
  # build-push and deploy skip gracefully when AWS is not yet set up.
  check-aws:
    name: Check AWS Configuration
    runs-on: ubuntu-latest
    needs: [test, security-scan, terraform-lint]
    if: github.event_name == 'push'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check AWS secrets
        id: check
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -n "$ECR_REGISTRY" ] && [ -n "$AWS_ROLE_ARN" ] && [ -n "$EC2_INSTANCE_ID" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✓ AWS secrets configured — proceeding with build & deploy"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠ AWS secrets not set or infra is down — skipping build & deploy"
            echo "  Run scripts/infra-up.sh to bring infra up and set secrets"
          fi

  # ─── Job 4: Generate Image Tag ─────────────────────────────────────────────
  # Compute the tag once here so all parallel build jobs use the same value.
  generate-tag:
    name: Generate Image Tag
    runs-on: ubuntu-latest
    needs: [check-aws]
    if: github.event_name == 'push' && needs.check-aws.outputs.configured == 'true'
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

  # ─── Job 5: Build and Push (parallel matrix) ────────────────────────────────
  # All four services build simultaneously — each gets its own runner.
  # Previously sequential (secureship → statusservice → ragservice → autopilot),
  # this cuts build time roughly 4×.
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [generate-tag, check-aws]
    if: github.event_name == 'push' && needs.check-aws.outputs.configured == 'true'
    strategy:
      matrix:
        include:
          - service: secureship
            context: apps/secureship
          - service: statusservice
            context: apps/statusservice
          - service: ragservice
            context: apps/ragservice
          - service: llm-alert-autopilot
            context: apps/llm-alert-autopilot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ needs.generate-tag.outputs.tag }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker pull "$REGISTRY/$SERVICE:latest" 2>/dev/null && \
            CACHE_FLAG="--cache-from $REGISTRY/$SERVICE:latest" || CACHE_FLAG=""
          docker build \
            $CACHE_FLAG \
            --tag "$REGISTRY/$SERVICE:$TAG" \
            --tag "$REGISTRY/$SERVICE:${{ github.ref_name }}" \
            ${{ matrix.context }}/
          docker push "$REGISTRY/$SERVICE:$TAG"
          docker push "$REGISTRY/$SERVICE:${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" == "main" ]; then
            docker tag "$REGISTRY/$SERVICE:$TAG" "$REGISTRY/$SERVICE:latest"
            docker push "$REGISTRY/$SERVICE:latest"
          fi

  update-k8s-manifests:
    name: Update K8s Image Tags
    runs-on: ubuntu-latest
    needs: [generate-tag, build-push, check-aws]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-aws.outputs.configured == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in K8s manifests
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ needs.generate-tag.outputs.tag }}
        run: |
          # Regex matches both the placeholder (first deploy) and any prior real tag
          # (subsequent deploys). Pattern: image: <anything>/secureship:<anything>
          # This makes the step idempotent regardless of what tag is currently in git.
          sed -i -E "s|image: .*/secureship:[^ ]+|image: $REGISTRY/secureship:$TAG|" \
            kubernetes/apps/secureship/deployment.yaml
          sed -i -E "s|image: .*/statusservice:[^ ]+|image: $REGISTRY/statusservice:$TAG|" \
            kubernetes/apps/statusservice/deployment.yaml
          sed -i -E "s|image: .*/ragservice:[^ ]+|image: $REGISTRY/ragservice:$TAG|" \
            kubernetes/apps/ragservice/deployment.yaml

      - name: Commit and push manifest updates
        env:
          TAG: ${{ needs.generate-tag.outputs.tag }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add kubernetes/apps/
          git diff --staged --quiet || git commit -m "chore: update K8s image tags to $TAG"
          git pull --no-rebase -X ours origin main
          git push

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [generate-tag, build-push, check-aws, update-k8s-manifests]

    # Only deploy on main branch pushes when AWS is configured
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-aws.outputs.configured == 'true'
    
    # Environment with required reviewer approval
    # In GitHub: Settings → Environments → Create "production" → Add reviewer
    # This means someone must approve before the deployment runs
    environment:
      name: production
      url: https://secureship.click

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy via AWS SSM — no SSH port or public IP needed.
      # Runs deploy.sh directly as ubuntu via a single SSM command (no temp file).
      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ needs.generate-tag.outputs.tag }}
          INSTANCE_ID_FALLBACK: ${{ secrets.EC2_INSTANCE_ID }}
          OBS_IP_FALLBACK: ${{ secrets.OBS_SERVER_IP }}
        run: |
          # Look up app server instance ID by tag — auto-discovers new instance after
          # terraform destroy+apply so EC2_INSTANCE_ID secret never needs manual updating.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region ${{ env.AWS_REGION }} \
            --filters "Name=tag:Name,Values=observeops-app-server" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "⚠ Tag lookup failed — using EC2_INSTANCE_ID secret as fallback"
            INSTANCE_ID="$INSTANCE_ID_FALLBACK"
          fi

          # Read obs server IP from SSM using CI runner's OIDC credentials (full access).
          # Falls back to the GitHub secret if SSM is unavailable (e.g. infra not yet ready).
          OBS_SERVER_IP=$(aws ssm get-parameter \
            --name "/observeops/production/obs_server_ip" \
            --region ${{ env.AWS_REGION }} \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "")
          if [ -z "$OBS_SERVER_IP" ]; then
            echo "⚠ SSM read failed — using OBS_SERVER_IP secret as fallback"
            OBS_SERVER_IP="$OBS_IP_FALLBACK"
          fi
          echo "Obs server IP: $OBS_SERVER_IP"
          echo "Deploying $TAG to $INSTANCE_ID"

          # Single SSM command — sets env vars inline and runs deploy.sh as ubuntu.
          # Avoids the heredoc approach which breaks because SSM \n stays literal.
          # Files reset before git pull: deploy.sh injects real values into these on
          # every run (sed/cat), leaving them dirty; pull would abort without the reset.
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"runuser -l ubuntu -c 'git config --global --add safe.directory /opt/observeops; cd /opt/observeops && git checkout -- monitoring/alertmanager/alertmanager.yml nginx/nginx.conf monitoring/otel/otel-collector.yaml 2>/dev/null || true && git pull; export ECR_REGISTRY=$REGISTRY; export IMAGE_TAG=$TAG; export APP_DIR=/opt/observeops; export AWS_REGION=${{ env.AWS_REGION }}; export OBS_SERVER_IP=$OBS_SERVER_IP; bash /opt/observeops/scripts/deploy.sh'\"],executionTimeout=[\"600\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          # Poll until done (max 8 min)
          for i in $(seq 1 48); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --region ${{ env.AWS_REGION }} \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deploy successful"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --region ${{ env.AWS_REGION }} \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" --output text 2>/dev/null || true
              exit 1
            fi
          done
          echo "❌ Deploy timed out after 8 minutes"
          exit 1

      # Post deployment annotation to Grafana
      # This adds a vertical line on all dashboards showing exactly when we deployed
      # Makes it easy to correlate issues with deployments
      - name: Add Grafana deployment annotation
        if: success()
        continue-on-error: true
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: |
          curl -s -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"Deploy: ${{ github.sha }} by ${{ github.actor }}\",
              \"tags\": [\"deployment\", \"production\"]
            }"

      # Notify success
      - name: Deployment success notification
        if: success()
        run: echo "✅ Deployment successful - ${{ github.sha }}"

      # If deployment failed, the deploy script handles rollback automatically.
      # This step just notifies.
      - name: Deployment failure notification
        if: failure()
        run: echo "❌ Deployment failed - check logs above"
