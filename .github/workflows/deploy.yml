# ─── ObserveOps CI/CD ─────────────────────────────────────────────────────────
#
#   pull request to main      test
#   push to main              test → scans → build 4 images → deploy
#   manual run (on main)      the same as a push; scripts/infra-up.sh uses this
#
# The build and deploy jobs run only when the AWS stack exists. The stack is
# torn down between uses, so "is there anything to deploy to?" is a normal
# question for this pipeline, answered by the check-aws job.
#
# AWS access uses OIDC, not stored keys. For each job GitHub signs a short-lived
# token describing where the job runs; AWS checks it against the role's trust
# policy and returns credentials that expire within the hour. There is no AWS
# secret in this repository to leak or rotate (ADR-004). The role and its trust
# policy are created by scripts/bootstrap-aws-account.sh.
#
# Repository secrets used (none is a credential):
#   AWS_ROLE_ARN      which role to assume           set once, after bootstrap
#   ECR_REGISTRY      <account>.dkr.ecr.<region>.amazonaws.com/observeops
#   EC2_INSTANCE_ID   the app server; its presence means "the stack is up"
#                     (the last two are written by infra-up.sh and removed by infra-down.sh)

name: ObserveOps CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'analytics/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'analytics/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# The ceiling for every job. A job that needs more (an OIDC token, permission to
# upload scan results) asks for it in its own `permissions:` block, so no job
# holds a permission it does not use.
permissions:
  contents: read

# One pipeline per branch at a time, and never cancel one that is running:
# stopping an SSM deploy half way could leave the server with some containers on
# the new version and some on the old.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  PYTHON_VERSION: '3.11'

jobs:

  # ─── Test ───────────────────────────────────────────────────────────────────
  # Runs on every event. Nothing later runs if this fails.
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            apps/secureship/requirements.txt
            apps/ragservice/requirements.txt
            apps/statusservice/requirements.txt

      - name: Install SecureShip dependencies
        run: pip install -r apps/secureship/requirements.txt

      # RAGService needs PyTorch. The CPU-only build is ~350 MB; the default one
      # bundles GPU libraries and is ~2 GB.
      - name: Install RAGService dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r apps/ragservice/requirements.txt

      - name: Install StatusService dependencies
        run: pip install -r apps/statusservice/requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx pytest-asyncio

      # Each suite is a separate pytest run because each service has its own
      # `tests` package; collected together they would shadow one another.
      - name: Run SecureShip tests
        run: pytest apps/secureship/tests/ -v

      - name: Run StatusService tests
        run: pytest apps/statusservice/tests/ -v

      - name: Run RAGService tests
        run: pytest apps/ragservice/tests/ -v

      - name: Run LLM Alert Autopilot tests
        run: pytest apps/llm-alert-autopilot/tests/ -v

      - name: Run Lambda handler tests
        run: pytest apps/lambda/tests/ -v

      # Alert rules are code, so they have tests. promtool feeds synthetic series
      # into the real rule files and asserts which alerts fire and when
      # (monitoring/prometheus/tests/alerts_test.yml). This is what would have
      # caught five alerts that divided every series by itself (ADR-012).
      - name: Validate and unit-test Prometheus rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/rules" --entrypoint promtool \
            prom/prometheus:v3.15.0 check rules /rules/alerts.yml /rules/slo-rules.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/rules" --entrypoint promtool \
            prom/prometheus:v3.15.0 test rules /rules/tests/alerts_test.yml

      # The routing tree is logic too: check that each kind of alert reaches the
      # receivers it should, and that the deadman heartbeat reaches nothing else.
      - name: Validate AlertManager config and routing
        run: |
          amtool() {
            docker run --rm -v "$PWD/monitoring/alertmanager:/am" --entrypoint amtool \
              prom/alertmanager:v0.34.1 "$@"
          }
          amtool check-config /am/alertmanager.yml
          route() { amtool config routes test --config.file=/am/alertmanager.yml "$@"; }
          route --verify.receivers=llm-autopilot,slack-critical alertname=ServiceDown severity=critical job=secureship
          route --verify.receivers=llm-autopilot,slack-warnings alertname=HighLatency severity=warning job=secureship
          route --verify.receivers=watchdog-sink alertname=Watchdog severity=none

      - name: Validate the Alloy (log shipper) config
        run: |
          docker run --rm -v "$PWD/monitoring/alloy:/etc/alloy:ro" grafana/alloy:v1.20.1 \
            fmt /etc/alloy/config.alloy > /dev/null

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
        env:
          GROQ_API_KEY: placeholder-for-validation

      # There is deliberately no "RAG answer quality" step. apps/ragservice/eval.py
      # scores answers from a LIVE service and CI has none: the step that used to
      # run it skipped every case and printed PASS. What can be gated
      # deterministically is retrieval and the grounding check, which the
      # RAGService tests above cover (tests/test_retrieval.py).

  # ─── Security scan ──────────────────────────────────────────────────────────
  #   Trivy       known vulnerabilities in the dependencies this repo declares
  #   Bandit      insecure patterns in the Python source (blocks on HIGH)
  #   TruffleHog  credentials committed to git (blocks on a verified secret)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # upload results to the repository's Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # TruffleHog reads history, not just the latest commit

      # Scans the repository's files: requirements.txt, Dockerfiles, config. It
      # does not scan the built images (ECR does that on push). It REPORTS to the
      # Security tab and does not fail the build: a new CVE in a transitive
      # dependency would otherwise block an unrelated fix. In a team this would
      # block on CRITICAL with a reviewed ignore list.
      # Pinned to a release tag, never @master: a moving ref in a job that can
      # write security events is exactly the supply-chain risk ADR-008 describes.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Set up Python for Bandit
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r apps/ -ll -f json -o bandit-report.json || true

      - name: Fail on HIGH severity Bandit findings
        run: |
          HIGH=$(python3 -c "
          import json, sys
          data = json.load(open('bandit-report.json'))
          highs = [r for r in data.get('results', []) if r['issue_severity'] == 'HIGH']
          for h in highs:
              print(f\"{h['filename']}:{h['line_number']} — {h['issue_text']}\")
          print(len(highs))
          ")
          COUNT=$(echo "$HIGH" | tail -1)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ Bandit found $COUNT HIGH severity issues — fix before merging"
            echo "$HIGH"
            exit 1
          fi
          echo "✓ Bandit: no HIGH severity issues"

      # No base/head given: on a push the action scans the pushed commits, on a
      # manual run it scans the whole history. --only-verified reports a secret
      # only if it still works against the provider, so this never fails on a
      # look-alike string.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.99.0
        with:
          path: ./
          extra_args: --only-verified

  # ─── Terraform checks ───────────────────────────────────────────────────────
  terraform-lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"

      - name: terraform fmt check
        working-directory: terraform
        run: |
          terraform fmt -recursive
          if ! git diff --quiet; then
            echo "❌ Terraform files were not formatted. Run 'make fmt' before pushing."
            git diff --stat
            exit 1
          fi
          echo "✓ Terraform formatting is correct"

      # Syntax and internal consistency, without touching AWS or the state.
      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false > /dev/null
          terraform validate

      # Misconfiguration scan (open security groups, unencrypted storage, wide IAM).
      # Trivy's scanner replaced tfsec, which is no longer developed. Reports only:
      # exit-code 0. The findings it prints that are accepted here, and why, are in
      # the README under "Known limits".
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          exit-code: '0'

  # ─── Is there a stack to deploy to? ─────────────────────────────────────────
  check-aws:
    name: Check AWS Configuration
    runs-on: ubuntu-latest
    needs: [test, security-scan, terraform-lint]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions: {}     # reads three secrets' presence; needs nothing else
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check AWS secrets
        id: check
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [ -n "$ECR_REGISTRY" ] && [ -n "$AWS_ROLE_ARN" ] && [ -n "$EC2_INSTANCE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ Stack is up — building and deploying"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠ No stack (EC2_INSTANCE_ID is not set) — skipping build and deploy"
            echo "  scripts/infra-up.sh brings it up and sets the secrets"
          fi

  # ─── Image tag ──────────────────────────────────────────────────────────────
  # Computed once so all four builds and the deploy use the same value.
  generate-tag:
    name: Generate Image Tag
    runs-on: ubuntu-latest
    needs: [check-aws]
    if: needs.check-aws.outputs.configured == 'true'
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${SHORT_SHA}"

  # ─── Build and push (four images in parallel) ───────────────────────────────
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [generate-tag, check-aws]
    if: needs.check-aws.outputs.configured == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write      # request the OIDC token that AWS exchanges for credentials
    strategy:
      matrix:
        include:
          - service: secureship
            context: apps/secureship
          - service: statusservice
            context: apps/statusservice
          - service: ragservice
            context: apps/ragservice
          - service: llm-alert-autopilot
            context: apps/llm-alert-autopilot

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Three tags are pushed. The commit SHA is the one that gets deployed and
      # rolled back to. `main` and `latest` move on every build and are there for
      # people looking at the registry; nothing deploys from them.
      - name: Build and push ${{ matrix.service }}
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ needs.generate-tag.outputs.tag }}
          SERVICE: ${{ matrix.service }}
        # Every build starts from an empty cache. An earlier version passed
        # --cache-from <image>:latest, which looked like caching and did nothing:
        # BuildKit only reuses layers from an image that was built with cache
        # metadata embedded, and these never were. Real caching here means buildx
        # with a registry or GitHub cache backend; until that is measured to be
        # worth it, an honest slow build beats a fake fast one.
        run: |
          docker build \
            --tag "$REGISTRY/$SERVICE:$TAG" \
            --tag "$REGISTRY/$SERVICE:${{ github.ref_name }}" \
            --tag "$REGISTRY/$SERVICE:latest" \
            ${{ matrix.context }}/
          docker push "$REGISTRY/$SERVICE:$TAG"
          docker push "$REGISTRY/$SERVICE:${{ github.ref_name }}"
          docker push "$REGISTRY/$SERVICE:latest"

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [generate-tag, build-push, check-aws]
    if: needs.check-aws.outputs.configured == 'true'
    # The SSM poll below gives up after 12 minutes; this is the backstop.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    # Declaring the environment changes this job's OIDC subject to
    # "repo:<repo>:environment:production", which the role's trust policy names.
    # The environment itself only accepts deployments from main (set by the
    # bootstrap script). It has no required reviewers: one maintainer.
    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The app server has no public address and no SSH. The deploy is one SSM
      # command: pull this repository's main branch (compose file, configs,
      # deploy.sh) and run deploy.sh with the image tag built above.
      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ needs.generate-tag.outputs.tag }}
          INSTANCE_ID_FALLBACK: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # Find the app server by tag, so a rebuilt instance is picked up without
          # anyone editing a secret.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=observeops-app-server" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null || echo "")
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "⚠ Tag lookup found nothing — using the EC2_INSTANCE_ID secret"
            INSTANCE_ID="$INSTANCE_ID_FALLBACK"
          fi
          echo "Deploying $TAG to $INSTANCE_ID"

          # `git pull --ff-only` refuses to merge: if the checkout on the server has
          # been edited by hand the deploy stops instead of deploying a mixture.
          REMOTE="cd /opt/observeops && git pull --ff-only && ECR_REGISTRY=$REGISTRY IMAGE_TAG=$TAG APP_DIR=/opt/observeops AWS_REGION=${{ env.AWS_REGION }} DEPLOY_USER=github-actions bash scripts/deploy.sh"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $TAG" \
            --parameters "commands=[\"runuser -l ubuntu -c 'git config --global --add safe.directory /opt/observeops; $REMOTE'\"],executionTimeout=[\"780\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $COMMAND_ID"

          show_output() {
            echo "──────── deploy.sh output (last lines) ────────"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" --output text 2>/dev/null | tail -n 60 || true
            echo "──────── stderr ────────"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text 2>/dev/null | tail -n 30 || true
          }

          # Poll until done (max 12 min). The first deploy to a new server pulls
          # four images, one of them over a gigabyte, before anything starts.
          for i in $(seq 1 72); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              show_output
              echo "✅ Deploy successful"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              show_output
              echo "❌ Deploy failed with status: $STATUS (deploy.sh rolls back on its own when it can)"
              exit 1
            fi
          done
          show_output
          echo "❌ Deploy did not finish within 12 minutes"
          exit 1
