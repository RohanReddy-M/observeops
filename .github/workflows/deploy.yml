name: ObserveOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd apps/secureship
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          cd apps/secureship
          pytest tests/ -v

  build-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: echo "tag=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT

      - name: Build and push SecureShip
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/observeops/secureship:$IMAGE_TAG \
                       -t $ECR_REGISTRY/observeops/secureship:latest \
                       apps/secureship/
          docker push $ECR_REGISTRY/observeops/secureship:$IMAGE_TAG
          docker push $ECR_REGISTRY/observeops/secureship:latest

      - name: Build and push StatusService
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $ECR_REGISTRY/observeops/statusservice:$IMAGE_TAG \
                       -t $ECR_REGISTRY/observeops/statusservice:latest \
                       apps/statusservice/
          docker push $ECR_REGISTRY/observeops/statusservice:$IMAGE_TAG
          docker push $ECR_REGISTRY/observeops/statusservice:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.APP_INSTANCE_ID }}
          ECR_REGISTRY: 198239799708.dkr.ecr.ap-south-1.amazonaws.com
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
        run: |
          aws ssm send-command \
            --instance-id $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              'aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ECR_REGISTRY',
              'cd /opt/observeops && git pull',
              'docker pull $ECR_REGISTRY/observeops/secureship:latest',
              'docker pull $ECR_REGISTRY/observeops/statusservice:latest',
              'docker compose up -d'
            ]" \
            --output text