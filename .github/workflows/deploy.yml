# ─── GitHub Actions CI/CD Pipeline ───────────────────────────────────────────
# This pipeline runs automatically when you push code to GitHub.
#
# Flow:
# Push to any branch → test + build
# Push to main       → test + build + deploy to production (with approval)
#
# Authentication:
# We use OIDC (OpenID Connect) instead of storing AWS keys in GitHub Secrets.
# OIDC = GitHub proves its identity to AWS, AWS issues temporary credentials.
# Why: Static keys are a security risk. OIDC credentials are temporary (1 hour).
#
# SETUP REQUIRED:
# 1. Create OIDC provider in AWS IAM for GitHub
# 2. Create IAM role with ECR push + EC2 permissions
# 3. Add these GitHub Secrets:
#    - AWS_ROLE_ARN: arn:aws:iam::ACCOUNT_ID:role/github-actions-role
#    - EC2_APP_HOST: private IP of app server  
#    - EC2_SSH_KEY: private SSH key (keep .pem contents)
#    - ECR_REGISTRY: ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com

name: ObserveOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Scope GITHUB_TOKEN to minimum required permissions.
# Default is write-all which is a security risk — a compromised workflow could
# push code, delete branches, or create releases.
permissions:
  contents: read        # checkout
  id-token: write       # OIDC: exchange token for AWS credentials
  security-events: write # Upload SARIF scan results to GitHub Security tab

env:
  AWS_REGION: ap-south-1
  PYTHON_VERSION: '3.11'

jobs:

  # ─── Job 1: Test ────────────────────────────────────────────────────────────
  # Runs on every push and PR. Pipeline stops here if tests fail.
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'    # Cache pip packages between runs (faster builds)

      - name: Install SecureShip dependencies
        run: pip install -r apps/secureship/requirements.txt

      # RAGService deps include PyTorch — install CPU-only build (~350 MB, not ~2 GB GPU build)
      - name: Install RAGService dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r apps/ragservice/requirements.txt

      - name: Install test dependencies
        run: pip install pytest httpx pytest-asyncio

      - name: Run SecureShip tests
        run: pytest apps/secureship/tests/ -v

      - name: Run RAGService tests
        run: pytest apps/ragservice/tests/ -v

      # Verify Docker build works (catches Dockerfile errors early)
      - name: Verify Docker builds
        run: |
          docker build -t secureship-test apps/secureship/
          docker build -t statusservice-test apps/statusservice/

  # ─── Job 2: Security Scan ───────────────────────────────────────────────────
  # Runs on every push AFTER tests pass.
  # Three tools, three layers of security:
  #   Trivy   = dependency vulnerabilities (CVEs in Python packages)
  #   Bandit  = static code analysis (SQL injection, hardcoded passwords, etc.)
  #   TruffleHog = git history scan for accidentally committed secrets
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history needed for TruffleHog secret scan

      # Trivy scans all files for known CVEs in Python packages, OS packages,
      # and config files. Results appear in GitHub Security tab as SARIF.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Bandit is Python-specific SAST (Static Application Security Testing).
      # It catches: shell injection, hardcoded passwords, use of insecure functions.
      - name: Set up Python for Bandit
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r apps/ -ll -f json -o bandit-report.json || true

      - name: Fail on HIGH severity Bandit findings
        run: |
          HIGH=$(python3 -c "
          import json, sys
          data = json.load(open('bandit-report.json'))
          highs = [r for r in data.get('results', []) if r['issue_severity'] == 'HIGH']
          for h in highs:
              print(f\"{h['filename']}:{h['line_number']} — {h['issue_text']}\")
          print(len(highs))
          ")
          COUNT=$(echo "$HIGH" | tail -1)
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ Bandit found $COUNT HIGH severity issues — fix before merging"
            echo "$HIGH"
            exit 1
          fi
          echo "✓ Bandit: no HIGH severity issues"

      # TruffleHog scans git commits for secrets (API keys, passwords, tokens).
      # It compares HEAD to the default branch — catches secrets in new commits.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ─── Job 3b: Check AWS secrets ─────────────────────────────────────────────
  # Detects whether ECR_REGISTRY and AWS_ROLE_ARN are configured.
  # build-push and deploy skip gracefully when AWS is not yet set up.
  check-aws:
    name: Check AWS Configuration
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check AWS secrets
        id: check
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$ECR_REGISTRY" ] && [ -n "$AWS_ROLE_ARN" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✓ AWS secrets configured — proceeding with build & deploy"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠ AWS secrets not set — skipping build & deploy"
            echo "  Set ECR_REGISTRY and AWS_ROLE_ARN in GitHub Secrets to enable"
          fi

  # ─── Job 4: Build and Push ──────────────────────────────────────────────────
  build-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [test, security-scan, check-aws]

    # Only run on pushes when AWS secrets are configured
    if: github.event_name == 'push' && needs.check-aws.outputs.configured == 'true'
    
    # Outputs let other jobs use values computed in this job
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC Authentication - no static keys needed
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # This action exchanges GitHub's OIDC token for temporary AWS credentials
          # Credentials expire in 1 hour - much safer than long-lived keys

      # ECR login so Docker can push to our private registry
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Generate image tags
      # We tag with: git SHA (unique per commit) + branch name + latest (main only)
      # Using git SHA means you can always trace an image back to the exact code commit
      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

      # Build and push SecureShip
      - name: Build and push SecureShip
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --tag "$REGISTRY/secureship:$TAG" \
            --tag "$REGISTRY/secureship:${{ github.ref_name }}" \
            --cache-from "$REGISTRY/secureship:latest" \
            apps/secureship/
          
          docker push "$REGISTRY/secureship:$TAG"
          docker push "$REGISTRY/secureship:${{ github.ref_name }}"
          
          # Also tag as 'latest' if this is the main branch
          if [ "${{ github.ref_name }}" == "main" ]; then
            docker tag "$REGISTRY/secureship:$TAG" "$REGISTRY/secureship:latest"
            docker push "$REGISTRY/secureship:latest"
          fi

      # Build and push StatusService
      - name: Build and push StatusService
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --tag "$REGISTRY/statusservice:$TAG" \
            --tag "$REGISTRY/statusservice:${{ github.ref_name }}" \
            apps/statusservice/
          docker push "$REGISTRY/statusservice:$TAG"
          docker push "$REGISTRY/statusservice:${{ github.ref_name }}"

      # RAGService image is larger (~2GB with PyTorch) — cache layers aggressively
      - name: Build and push RAGService
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            --tag "$REGISTRY/ragservice:$TAG" \
            --tag "$REGISTRY/ragservice:${{ github.ref_name }}" \
            --cache-from "$REGISTRY/ragservice:latest" \
            apps/ragservice/
          docker push "$REGISTRY/ragservice:$TAG"
          docker push "$REGISTRY/ragservice:${{ github.ref_name }}"
          if [ "${{ github.ref_name }}" == "main" ]; then
            docker tag "$REGISTRY/ragservice:$TAG" "$REGISTRY/ragservice:latest"
            docker push "$REGISTRY/ragservice:latest"
          fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push, check-aws]

    # Only deploy on main branch pushes when AWS is configured
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-aws.outputs.configured == 'true'
    
    # Environment with required reviewer approval
    # In GitHub: Settings → Environments → Create "production" → Add reviewer
    # This means someone must approve before the deployment runs
    environment:
      name: production
      url: https://secureship.click

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy via AWS SSM — no SSH port or public IP needed.
      # SSM tunnels the command through the AWS API to the private EC2.
      - name: Deploy to EC2 via SSM
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ needs.build-push.outputs.image-tag }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          echo "Deploying to: $INSTANCE_ID"

          # Send deploy command via SSM.
          # Run as ubuntu (owns /opt/observeops) — git rejects root ownership mismatch.
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --cli-input-json "{
              \"InstanceIds\": [\"$INSTANCE_ID\"],
              \"DocumentName\": \"AWS-RunShellScript\",
              \"Parameters\": {
                \"commands\": [
                  \"sudo -u ubuntu git -C /opt/observeops pull\",
                  \"sudo -u ubuntu bash -c 'ECR_REGISTRY=$REGISTRY IMAGE_TAG=$TAG APP_DIR=/opt/observeops AWS_REGION=${{ env.AWS_REGION }} bash /opt/observeops/scripts/deploy.sh'\"
                ],
                \"executionTimeout\": [\"300\"]
              }
            }" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command ID: $COMMAND_ID"

          # Wait for command to finish (polls every 5s, max ~8 min)
          aws ssm wait command-executed \
            --region ${{ env.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          # Print output and fail the job if deploy failed
          RESULT=$(aws ssm get-command-invocation \
            --region ${{ env.AWS_REGION }} \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID")
          echo "$RESULT" | jq -r '.StandardOutputContent'
          STATUS=$(echo "$RESULT" | jq -r '.Status')
          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deploy failed with status: $STATUS"
            echo "$RESULT" | jq -r '.StandardErrorContent'
            exit 1
          fi
          echo "✅ Deploy successful"

      # Post deployment annotation to Grafana
      # This adds a vertical line on all dashboards showing exactly when we deployed
      # Makes it easy to correlate issues with deployments
      - name: Add Grafana deployment annotation
        if: success()
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
        run: |
          curl -s -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"Deploy: ${{ github.sha }} by ${{ github.actor }}\",
              \"tags\": [\"deployment\", \"production\"]
            }"

      # Notify success
      - name: Deployment success notification
        if: success()
        run: echo "✅ Deployment successful - ${{ github.sha }}"

      # If deployment failed, the deploy script handles rollback automatically.
      # This step just notifies.
      - name: Deployment failure notification
        if: failure()
        run: echo "❌ Deployment failed - check logs above"
